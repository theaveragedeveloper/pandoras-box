      return null;
    }
    return base;
  }
  function addDrawLayers() {
    if (!map.isStyleLoaded() || map.getSource("drawings-src")) return;
    map.addSource("drawings-src", { type: "geojson",
      data: { type: "FeatureCollection", features: [] } });
    map.addLayer({ id: "drawings-fill", type: "fill", source: "drawings-src",
      filter: ["all", drawFilter(), ["==", ["geometry-type"], "Polygon"]],
      paint: { "fill-color": ["get", "color"], "fill-opacity": 0.25 } });
    map.addLayer({ id: "drawings-line", type: "line", source: "drawings-src",
      filter: drawFilter(),
      paint: { "line-color": ["get", "color"], "line-width": 2 } });
    map.addLayer({ id: "drawings-points", type: "circle", source: "drawings-src",
      filter: ["all", drawFilter(), ["==", ["geometry-type"], "Point"]],
      paint: { "circle-color": ["get", "color"], "circle-radius": 7,
               "circle-stroke-color": "#111726", "circle-stroke-width": 2 } });
    map.addLayer({ id: "drawings-labels", type: "symbol", source: "drawings-src",
      filter: ["all", drawFilter(), ["!=", ["get", "label"], ""]],
      layout: { "text-field": ["get", "label"], "text-font": ["Noto Sans Regular"],
                "text-size": 12, "text-anchor": "top", "text-offset": [0, 1],
                "text-allow-overlap": true },
      paint: { "text-color": "#EDF0F7", "text-halo-color": "#111726", "text-halo-width": 1 } });
  }
  function renderDrawings() {
    updateDrawLayers();
    renderDrawList();
  }
  // Map layers only (no list rebuild): the circle-radius preview
  // calls this on every mousemove, and rebuilding the whole list
  // DOM per mouse move would thrash the panel.
  function updateDrawLayers() {
    // Before the style loads there is nothing to draw on yet; the
    // style.load handler re-renders once it is ready.
    if (!map.isStyleLoaded()) return;
    addDrawLayers();
    var features = drawings.map(drawingsFeature);
    var preview = previewFeature();
    if (preview) features.push(preview);
    var src = map.getSource("drawings-src");
    if (src) src.setData({ type: "FeatureCollection", features: features });
  }
  function drawSummary(d) {
    var g = d.geometry;
    if (d.kind === "marker") return g.lat.toFixed(5) + ", " + g.lon.toFixed(5);
    if (d.kind === "circle") {
      return "radius " + (g.radius_m >= 1000
        ? (g.radius_m / 1000).toFixed(1) + " km" : Math.round(g.radius_m) + " m");
    }
    return (g.points || []).length + " points";
  }
  function flyToDrawing(d) {
    var g = d.geometry;
    if (d.kind === "marker" || d.kind === "circle") {
      map.flyTo({ center: [g.lon, g.lat], zoom: Math.max(map.getZoom(), 13), duration: 400, essential: true });
      return;
    }
    var lons = g.points.map(function (p) { return p[1]; });
    var lats = g.points.map(function (p) { return p[0]; });
    map.fitBounds([[Math.min.apply(null, lons), Math.min.apply(null, lats)],
                   [Math.max.apply(null, lons), Math.max.apply(null, lats)]],
                  { padding: 60, duration: 400, essential: true });
  }
  function renderDrawList() {
    drawList.innerHTML = "";
    drawEmpty.hidden = drawings.length > 0;
    drawings.forEach(function (d) {
      var row = document.createElement("div");
      row.className = "drawrow";
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = (DRAW_TYPES[d.type] || DRAW_TYPES.other).color;
      var info = document.createElement("button");
      info.type = "button";
      info.className = "draw-info";
      info.textContent = (d.label ? d.label + " — " : "")
        + (DRAW_TYPES[d.type] || DRAW_TYPES.other).label + " · " + drawSummary(d);
      info.addEventListener("click", function () { flyToDrawing(d); });
      var edit = document.createElement("button");
      edit.type = "button";
      edit.className = "draw-edit";
      edit.textContent = "Edit";
      edit.setAttribute("aria-label", "Edit " + (d.label || d.type));
      edit.addEventListener("click", function () { openDrawForm(d); });
      var del = document.createElement("button");
      del.type = "button";
      del.className = "draw-del";
      del.textContent = "×";
      del.setAttribute("aria-label", "Remove " + (d.label || d.type));
      del.addEventListener("click", function () {
        drawingsPost({ action: "delete", id: d.id }).then(loadDrawings).catch(function () {
          showStatus("Could not remove that item — is the hub still running?");
        });
      });
      row.appendChild(dot);
      row.appendChild(info);
      row.appendChild(edit);
      row.appendChild(del);
      drawList.appendChild(row);
    });
  }
  // Points are stored [lat, lon] (like pins); MapLibre wants
  // [lon, lat]. One helper, so the reversal lives in one place.
  function toLngLat(points) {
    return points.map(function (p) { return [p[1], p[0]]; });
  }
  function closeRing(points) {
    var ring = toLngLat(points);
    ring.push(ring[0]);
    return ring;
  }
  function drawingsPost(body) {
    return fetch("/api/drawings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error("drawings request failed");
      return r.json();
    });
  }
  function loadDrawings() {
    return fetch("/api/drawings", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("drawings fetch failed");
        return r.json();
      })
      .then(function (data) {
        drawings = Array.isArray(data.drawings) ? data.drawings : [];
        renderDrawings();
      })
      .catch(function () {
        showStatus("Could not load drawn items from the hub.");
      });
  }
  function openDrawForm(existing) {
    editingDrawId = existing ? existing.id : null;
    drawLabel.value = existing ? (existing.label || "") : "";
    drawType.value = existing ? existing.type : "other";
    drawForm.hidden = false;
    // A pending shape's form must be visible, even if the panel
    // was collapsed while drawing.
    drawingsBox.classList.remove("collapsed");
    var toggle = document.getElementById("drawings-toggle");
    toggle.textContent = "Hide";
    toggle.setAttribute("aria-expanded", "true");
    drawLabel.focus();
  }
  function closeDrawForm() {
    drawForm.hidden = true;
    editingDrawId = null;
    drawLabel.value = "";
  }
  // Drawing ids are random hex, like pin ids — but generated here,
  // so drawings do not depend on pins.js being loaded.
  function newDrawId() {
    return Array.from(crypto.getRandomValues(new Uint8Array(8)), function (b) {
      return b.toString(16).padStart(2, "0");
    }).join("");
  }
  document.getElementById("draw-save").addEventListener("click", function () {
    var type = drawType.value;
    // An empty label defaults to the type name, so every item gets
    // a label even when the owner leaves the box blank.
    var label = (drawLabel.value || "").trim()
      || (DRAW_TYPES[type] || DRAW_TYPES.other).label;
    if (editingDrawId) {
      var existing = null;
      drawings.forEach(function (d) { if (d.id === editingDrawId) existing = d; });
      if (!existing) { closeDrawForm(); return; }
      var updated = { id: existing.id, kind: existing.kind, type: type,
                      label: label, geometry: existing.geometry };
      drawingsPost({ action: "update", drawing: updated }).then(function () {
        closeDrawForm();
        loadDrawings();
      }).catch(function () {
        showStatus("Could not save that change — is the hub still running?");
      });
      return;
    }
    if (!pendingDraw) { closeDrawForm(); return; }
    var item = { id: newDrawId(), kind: pendingDraw.kind, type: type,
                 label: label, geometry: pendingDraw.geometry };
    drawingsPost({ action: "add", drawing: item }).then(function () {
      pendingDraw = null;
      drawPoints = [];
      closeDrawForm();
      loadDrawings();
    }).catch(function () {
      showStatus("Could not save that drawing — is the hub still running?");
    });
  });
  document.getElementById("draw-form-cancel").addEventListener("click", function () {
    // Cancel the form only: the in-progress shape is discarded,
    // but draw mode stays on so another item can be drawn at once.
    pendingDraw = null;
    drawPoints = [];
    closeDrawForm();
    renderDrawings();
  });
  drawLabel.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("draw-save").click();
    }
  });
  var drawingsToggle = document.getElementById("drawings-toggle");
  drawingsToggle.addEventListener("click", function () {
    var collapsed = drawingsBox.classList.toggle("collapsed");
    drawingsToggle.textContent = collapsed ? "Show" : "Hide";
    drawingsToggle.setAttribute("aria-expanded", String(!collapsed));
  });

  // -- repeaters: ham/GMRS + public MeshCore ---------------------------
  // Public infrastructure from /api/repeaters (fetched 2026-11-25):
  // 74 ham + 0 GMRS with coordinates, 996 MeshCore — 1,070 plotted
  // markers, so the layer is clustered (one clustered GeoJSON
  // source per type; a single source would make a cluster's count
  // include hidden types). The 10 list-only entries (no
  // coordinates) are never plotted: the payload keeps them
  // separate and the panel only names the count. Unlike
  // pins/drawings this layer is shareable — a hotspot client gets
  // the panel and the markers too.
  var REP_TYPES = {
    "ham": { label: "Ham", color: "#4AA3FF" },
    "gmrs": { label: "GMRS", color: "#55D5A1" },
    "meshcore": { label: "MeshCore", color: "#B388EB" }
  };
  var repeaters = [];
  var repeaterCounts = { ham: 0, gmrs: 0, meshcore: 0 };
  var repeaterListOnly = [];
  var hiddenRepTypes = new Set();
  var repById = {};
  var repPopup = null;
  var repeatersBox = document.getElementById("repeaters");
  var repList = document.getElementById("rep-list");
  var repEmpty = document.getElementById("rep-empty");
  var repFoot = document.getElementById("rep-foot");
  var repFilters = document.getElementById("rep-type-filters");

  function repLayers(kind) {
    return ["repeaters-" + kind + "-clusters",
            "repeaters-" + kind + "-cluster-count",
            "repeaters-" + kind + "-points"];
  }
  function addRepLayers() {
    if (!map.isStyleLoaded()) return;
    Object.keys(REP_TYPES).forEach(function (kind) {
      var srcId = "repeaters-" + kind + "-src";
      if (map.getSource(srcId)) return;
      map.addSource(srcId, { type: "geojson",
        data: { type: "FeatureCollection", features: [] },
        cluster: true, clusterMaxZoom: 14, clusterRadius: 50 });
      map.addLayer({ id: "repeaters-" + kind + "-clusters", type: "circle", source: srcId,
        filter: ["has", "point_count"],
        paint: { "circle-color": REP_TYPES[kind].color,
                 "circle-radius": ["step", ["get", "point_count"], 16, 10, 22, 50, 28],
                 "circle-opacity": 0.9, "circle-stroke-color": "#111726",
                 "circle-stroke-width": 2 } });
      map.addLayer({ id: "repeaters-" + kind + "-cluster-count", type: "symbol", source: srcId,
        filter: ["has", "point_count"],
        layout: { "text-field": ["get", "point_count"],
                  "text-font": ["Noto Sans Regular"], "text-size": 12 },
        paint: { "text-color": "#111726" } });
      map.addLayer({ id: "repeaters-" + kind + "-points", type: "circle", source: srcId,
        filter: ["!", ["has", "point_count"]],
        paint: { "circle-color": REP_TYPES[kind].color, "circle-radius": 6,
                 "circle-stroke-color": "#111726", "circle-stroke-width": 2 } });
    });
  }
  function repFeature(r) {
    return { type: "Feature",
             properties: { id: r.id, kind: r.kind,
                           label: r.callsign || r.name || "" },
             geometry: { type: "Point", coordinates: [r.lon, r.lat] } };
  }
  function updateRepLayers() {
    if (!map.isStyleLoaded()) return;
    addRepLayers();
    Object.keys(REP_TYPES).forEach(function (kind) {
      var src = map.getSource("repeaters-" + kind + "-src");
      if (!src) return;
      src.setData({ type: "FeatureCollection",
                    features: repeaters.filter(function (r) { return r.kind === kind; })
                      .map(repFeature) });
    });
  }
  function applyRepVisibility() {
    if (!map.isStyleLoaded()) return;
    Object.keys(REP_TYPES).forEach(function (kind) {
      var visible = hiddenRepTypes.has(kind) ? "none" : "visible";
      repLayers(kind).forEach(function (id) {
        if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", visible);
      });
    });
  }
  function repKm(r) {
    return (typeof r.distance_km === "number" && isFinite(r.distance_km))
      ? r.distance_km.toFixed(1) + " km" : "";
  }
  function repRowLabel(r) {
    var name = r.kind === "meshcore" ? (r.name || "MeshCore repeater")
      : (r.callsign || "Repeater");
    var where = r.location || "";
    var km = repKm(r);
    return name + (where ? " — " + where : "") + (km ? " · " + km : "");
  }
  function renderRepList() {
    repList.innerHTML = "";
    var shown = repeaters.filter(function (r) { return !hiddenRepTypes.has(r.kind); })
      .sort(function (a, b) {
        return (a.distance_km == null ? 99999 : a.distance_km)
          - (b.distance_km == null ? 99999 : b.distance_km);
      });
    repEmpty.hidden = shown.length > 0;
    if (!shown.length && repeaters.length > 0) {
      repEmpty.textContent = "No repeaters of the selected types.";
    }
    var rows = shown.slice(0, 200);
    rows.forEach(function (r) {
      var row = document.createElement("div");
      row.className = "drawrow";
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = (REP_TYPES[r.kind] || REP_TYPES.ham).color;
      var info = document.createElement("button");
      info.type = "button";
      info.className = "draw-info";
      info.textContent = repRowLabel(r);
      info.addEventListener("click", function () { flyToRepeater(r); });
      row.appendChild(dot);
      row.appendChild(info);
      repList.appendChild(row);
    });
    repFoot.textContent = "Showing nearest " + rows.length + " of " + shown.length
      + " plotted · " + repeaterListOnly.length
      + " list-only (no known location) not plotted"
      + " · MeshCore dots are self-reported listings, not a coverage guarantee.";
  }
  function renderRepeaters() {
    updateRepLayers();
    applyRepVisibility();
    renderRepList();
  }
  function buildRepChips() {
    repFilters.innerHTML = "";
    Object.keys(REP_TYPES).forEach(function (kind) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "draw-type-chip";
      chip.setAttribute("aria-pressed", "true");
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = REP_TYPES[kind].color;
      chip.appendChild(dot);
      chip.appendChild(document.createTextNode(
        REP_TYPES[kind].label + " · " + (repeaterCounts[kind] || 0)));
      chip.addEventListener("click", function () {
        if (hiddenRepTypes.has(kind)) hiddenRepTypes.delete(kind);
        else hiddenRepTypes.add(kind);
        chip.classList.toggle("off", hiddenRepTypes.has(kind));
        chip.setAttribute("aria-pressed", String(!hiddenRepTypes.has(kind)));
        applyRepVisibility();
        renderRepList();
      });
      repFilters.appendChild(chip);
    });
  }
  function fmtOffset(v) {
    var n = Number(v);
    if (!isFinite(n)) return "";
    return (n >= 0 ? "+" : "") + n.toFixed(1);
  }
  function repSeen(lastAdvert) {
    var t = Date.parse(lastAdvert || "");
    if (!isFinite(t)) return "unknown";
    var days = Math.floor((Date.now() - t) / 86400000);
    if (days <= 0) return "today";
    return days + (days === 1 ? " day ago" : " days ago");
  }
  // Detail card. Every data field goes through esc(): callsigns and
  // MeshCore names are outside data (RepeaterBook / a public map),
  // and the popup is an innerHTML sink.
  function repCardHtml(r) {
    if (r.kind === "meshcore") {
      return "<div class='rep-card'><h4>" + esc(r.name) + "</h4>"
        + "<div>MeshCore repeater</div>"
        + "<div>" + esc(r.frequency_mhz) + " MHz · " + esc(r.preset) + "</div>"
        + "<div>SF" + esc(r.sf) + " · BW " + esc(r.bw) + " · CR" + esc(r.cr) + "</div>"
        + "<div>Last seen: " + esc(repSeen(r.last_advert)) + "</div>"
        + "<div>Public key<br><span class='rep-key'>" + esc(r.public_key) + "</span> "
        + "<button type='button' class='rep-copy' data-key='" + esc(r.public_key)
        + "'>Copy</button></div>"
        + (repKm(r) ? "<div>" + esc(repKm(r)) + " from Braintree</div>" : "")
        + "<div class='rep-note'>Self-reported public listing — a dot is not a coverage guarantee.</div>"
        + "</div>";
    }
    var html = "<div class='rep-card'><h4>" + esc(r.callsign) + "</h4>"
      + "<div>" + (r.kind === "gmrs" ? "GMRS" : "Ham") + " repeater · " + esc(r.location) + "</div>"
      + "<div>Output " + esc(r.output_mhz) + " MHz · Input " + esc(r.input_mhz) + " MHz</div>"
      + "<div>Offset " + esc(fmtOffset(r.offset_mhz)) + " MHz · Tone "
      + esc(r.tone || "none") + "</div>";
    if ((r.modes || []).length) html += "<div>Modes: " + esc(r.modes.join(", ")) + "</div>";
    html += "<div>" + esc(r.use || "") + (r.on_air && r.on_air !== "unknown"
      ? " · " + esc(r.on_air) : "") + "</div>";
    if (r.note) html += "<div class='rep-note'>" + esc(r.note) + "</div>";
    if (r.coords_source) html += "<div class='rep-note'>Position: " + esc(r.coords_source) + "</div>";
    html += "<div><a href='/files/myfiles/baofeng-programming-notes.md'>"
      + "Baofeng / CHIRP programming notes</a></div></div>";
    return html;
  }
  function openRepCard(r) {
    if (repPopup) repPopup.remove();
    repPopup = new maplibregl.Popup({ closeButton: true, maxWidth: "320px" })
      .setLngLat([r.lon, r.lat]).setHTML(repCardHtml(r)).addTo(map);
  }
  function flyToRepeater(r) {
    map.flyTo({ center: [r.lon, r.lat], zoom: Math.max(map.getZoom(), 12),
                duration: 400, essential: true });
    openRepCard(r);
  }
  // Cluster click zooms into the cluster; point click opens the
  // card. Pin/draw mode owns the map click while it is on, so the
  // repeater click stands aside then.
  map.on("click", function (e) {
    if (drawMode || pinMode) return;
    var clusterIds = [], pointIds = [];
    Object.keys(REP_TYPES).forEach(function (kind) {
      clusterIds.push("repeaters-" + kind + "-clusters");
      pointIds.push("repeaters-" + kind + "-points");
    });
    // Before the first style.load the repeater layers do not exist
    // yet; querying a missing layer throws, so stand aside.
    if (!map.getLayer(pointIds[0])) return;
    var clusters = map.queryRenderedFeatures(e.point, { layers: clusterIds });
    if (clusters.length) {
      var feature = clusters[0];
      // Cluster features carry no source properties (no kind), so
      // the kind comes from the layer that rendered the cluster.
      var layerId = (feature.layer && feature.layer.id) || "";
      var kind = layerId.replace("repeaters-", "").replace("-clusters", "");
      var src = map.getSource("repeaters-" + kind + "-src");
      if (src) {
        src.getClusterExpansionZoom(feature.properties.cluster_id, function (err, zoom) {
          if (err) return;
          map.easeTo({ center: feature.geometry.coordinates, zoom: zoom });
        });
      }
      return;
    }
    var points = map.queryRenderedFeatures(e.point, { layers: pointIds });
    if (points.length) {
      var rep = repById[points[0].properties.id];
      if (rep) openRepCard(rep);
    }
  });
  // Copy button inside a popup card: the popup is rebuilt per card,
  // so the handler lives on the document, not the card.
  document.addEventListener("click", function (e) {
    var btn = e.target && e.target.closest ? e.target.closest(".rep-copy") : null;
    if (!btn) return;
    var key = btn.getAttribute("data-key") || "";
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(key).then(function () {
        btn.textContent = "Copied";
      }, function () { btn.textContent = "Copy failed"; });
    } else {
      btn.textContent = "Copy failed";
    }
  });
  var repeatersToggle = document.getElementById("repeaters-toggle");
  repeatersToggle.addEventListener("click", function () {
    var collapsed = repeatersBox.classList.toggle("collapsed");
    repeatersToggle.textContent = collapsed ? "Show" : "Hide";
    repeatersToggle.setAttribute("aria-expanded", String(!collapsed));
  });
  function loadRepeaters() {
    return fetch("/api/repeaters", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("repeaters fetch failed");
        return r.json();
      })
      .then(function (data) {
        repeaters = Array.isArray(data.repeaters) ? data.repeaters : [];
        repeaterCounts = data.counts || {};
        repeaterListOnly = Array.isArray(data.list_only) ? data.list_only : [];
        repeaters.forEach(function (r) { repById[r.id] = r; });
        buildRepChips();
        renderRepeaters();
      })
      .catch(function () {
        repEmpty.hidden = false;
        repEmpty.textContent = "Could not load repeaters from the hub.";
      });
  }

  // -- draw interaction -------------------------------------------------
  function setDrawTool(tool) {
    drawTool = tool;
    drawPoints = [];
    pendingDraw = null;
    // Switching tools abandons the in-progress shape — and the form
    // that went with it, so Save cannot silently discard it later.
    closeDrawForm();
    Array.prototype.forEach.call(
      drawTools.querySelectorAll("[data-tool]"), function (b) {
        b.classList.toggle("active", b.getAttribute("data-tool") === tool);
      });
    map.getCanvas().style.cursor = "crosshair";
    if (tool === "marker") {
      showStatus("Draw mode — click the map to place a marker.");
    } else if (tool === "circle") {
      showStatus("Draw mode — click the centre, then click a second point to set the radius.");
    } else {
      showStatus("Draw mode — click to add points, then Done (or Enter) to finish. Esc cancels.");
    }
  }
  function exitDrawMode() {
    drawMode = false;
    drawTool = null;
    drawPoints = [];
    pendingDraw = null;
    drawModeBtn.classList.remove("active");
    drawTools.hidden = true;
    map.getCanvas().style.cursor = "";
    map.doubleClickZoom.enable();
    map.dragPan.enable();
    closeDrawForm();
    renderDrawings();
    hideStatus();
  }
  drawModeBtn.addEventListener("click", function () {
    if (drawMode) { exitDrawMode(); return; }
    // Pin mode and draw mode share the map click: only one is on.
    if (pinMode) {
      pinMode = false;
      pinBtn.classList.remove("active");
    }
    drawMode = true;
    drawModeBtn.classList.add("active");
    drawTools.hidden = false;
    map.doubleClickZoom.disable();
    map.dragPan.disable();
    setDrawTool("marker");
  });
  drawTools.querySelectorAll("[data-tool]").forEach(function (b) {
    b.addEventListener("click", function () { setDrawTool(b.getAttribute("data-tool")); });
  });
  document.getElementById("draw-done").addEventListener("click", finishDraw);
  document.getElementById("draw-cancel").addEventListener("click", exitDrawMode);
  function handleDrawClick(lngLat) {
    // While the label/type form is open, the shape is finished —
    // map clicks must not append vertices (or replace the pending
    // marker) underneath it.
    if (!drawForm.hidden) return;
    var lat = lngLat.lat, lon = lngLat.lng;
    if (drawTool === "marker") {
      pendingDraw = { kind: "marker", geometry: { lat: lat, lon: lon } };
      renderDrawings();
      openDrawForm(null);
      return;
    }
    if (drawTool === "circle") {
      if (drawPoints.length === 0) {
        drawPoints = [[lat, lon]];
        pendingDraw = { kind: "circle", geometry: { lat: lat, lon: lon, radius_m: 1 } };
        showStatus("Draw mode — now click a second point to set the radius.");
      } else {
        var c = drawPoints[0];
        var r = haversineKm(c[0], c[1], lat, lon) * 1000;
        if (r < 1) {
          showStatus("Draw mode — pick a second point further away to set the radius.");
          return;
        }
        pendingDraw = { kind: "circle",
                        geometry: { lat: c[0], lon: c[1], radius_m: Math.round(r) } };
        drawPoints = [];
        renderDrawings();
        openDrawForm(null);
      }
      return;
    }
    // Line / area: accumulate vertices; Done (or Enter) finishes.
    drawPoints.push([lat, lon]);
    pendingDraw = { kind: drawTool, geometry: { points: drawPoints.slice() } };
    renderDrawings();
  }
  function finishDraw() {
    if (!pendingDraw || !drawTool) return;
    if (drawTool === "line" && drawPoints.length < 2) {
      showStatus("Draw mode — a line needs at least two points.");
      return;
    }
    if (drawTool === "polygon" && drawPoints.length < 3) {
      showStatus("Draw mode — an area needs at least three points.");
      return;
    }
    openDrawForm(null);
  }
  // Circle radius preview: while the centre is picked, the ring
  // follows the mouse so the radius is visible before committing.
  map.on("mousemove", function (e) {
    if (!drawMode || drawTool !== "circle" || drawPoints.length === 0 || !pendingDraw) return;
    var c = drawPoints[0];
    var r = haversineKm(c[0], c[1], e.lngLat.lat, e.lngLat.lng) * 1000;
    pendingDraw.geometry.radius_m = Math.max(1, Math.round(r));
    // Map layers only — the list is untouched by a radius preview.
    updateDrawLayers();
  });
  document.addEventListener("keydown", function (e) {
    if (!drawMode) return;
    // Typing in the label box must not trigger draw shortcuts:
    // Enter there saves the form instead.
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (e.key === "Escape") exitDrawMode();
    else if (e.key === "Enter" && (drawTool === "line" || drawTool === "polygon")) finishDraw();
  });

  pinBtn.addEventListener("click", function () {
    pinMode = !pinMode;
    pinBtn.classList.toggle("active", pinMode);
    map.getCanvas().style.cursor = pinMode ? "crosshair" : "";
    // Pin mode and draw mode share the map click: only one is on.
    if (pinMode && drawMode) exitDrawMode();
    if (pinMode) showStatus("Pin mode on — click the map to drop a pin. Click Add pin again to stop.");
    else hideStatus();
  });

  map.on("click", function (e) {
    if (drawMode && drawTool) { handleDrawClick(e.lngLat); return; }
    if (!pinMode) return;
    addPin(e.lngLat.lat, e.lngLat.lng, "");
    hideStatus();
  });

  // A street address for the offline address index: a house number,
  // a street suffix (St, Ave, Rd…), or a town after a comma.
  // Place names ("Blue Hills", "Quincy Center") have none of
  // these and go to the place search instead.
  var STREET_SUFFIX = /\b(st|street|ave|avenue|av|rd|road|dr|drive|ln|lane|ct|court|pl|place|blvd|ter|terrace|cir|circle|hwy|highway|sq|square|pkwy|parkway|trl|trail|way)\b/i;
  function looksLikeAddress(t) {
    return /^\d+[A-Za-z]?\s+\S/.test(t) || t.indexOf(",") >= 0 || STREET_SUFFIX.test(t);
  }

  // Address lookup: the hub's offline address index. No match (or
  // no index yet) falls back to the place search.
  function geocodeAndFly(t) {
    fetch("/api/geocode?q=" + encodeURIComponent(t))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var res = (data.results || [])[0];
        if (!res || typeof res.lat !== "number" || typeof res.lon !== "number") { searchPlace(t); return; }
        map.flyTo({ center: [res.lon, res.lat], zoom: Math.min(16, map.getMaxZoom()), duration: 400, essential: true });
        // An address lookup drops a pin whose address is the
        // geocoded display address (no label yet — name it from
        // the Saved Locations "Save a house" form on the hub).
        addPin(res.lat, res.lon, "", res.display || "");
        hideStatus();
      })
      .catch(function () { searchPlace(t); });
  }

  // -- go to: coordinates, street address, or a place name ----------
  var gotoInput = document.getElementById("goto");
  // Place name: ask the hub's place search (offline gazetteer).
  // onMiss runs when no place matches, so the go-to box can fall
  // back to the address index for street names.
  function searchPlace(t, onMiss) {
    fetch("/api/search?q=" + encodeURIComponent(t))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var hit = null;
        (data.groups || []).forEach(function (g) {
          if (hit) return;
          (g.results || []).forEach(function (r) {
            if (!hit && typeof r.lat === "number" && typeof r.lon === "number") hit = r;
          });
        });
        if (!hit) {
          if (onMiss) { onMiss(); return; }
          showStatus("No place found for &quot;" + esc(t) + "&quot;.");
          return;
        }
        map.flyTo({ center: [hit.lon, hit.lat], zoom: 13, duration: 400, essential: true });
        addPin(hit.lat, hit.lon, hit.title);
        hideStatus();
      })
      .catch(function () { showStatus("Place search failed — is the hub still running?"); });
  }
  function goTo(text) {
    var t = (text || "").trim();
    if (!t) return;
    // Coordinates: "42.36, -71.06" or "42.36 -71.06". Lat first;
    // if the first number is out of lat range, assume lon, lat.
    var m = t.match(/^(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)$/);
    if (m) {
      var a = parseFloat(m[1]), b = parseFloat(m[2]);
      var la, lo;
      if (Math.abs(a) <= 90 && Math.abs(b) <= 180) { la = a; lo = b; }
      else if (Math.abs(a) <= 180 && Math.abs(b) <= 90) { la = b; lo = a; }
      else { showStatus("Coordinates out of range."); return; }
      map.flyTo({ center: [lo, la], zoom: 13, duration: 400, essential: true });
      addPin(la, lo, "");
      hideStatus();
      return;
    }
    // Street address — the hub's offline address index
    // (OpenStreetMap). A full address works, and so does a partial
    // one ("Granite St", "Granite St, Braintree"): the index
    // prefix-matches street names.
    if (looksLikeAddress(t)) {
      if (/^\d+[A-Za-z]?\s+\S/.test(t)) {
        // House number: definitely an address — straight to the index.
        geocodeAndFly(t);
        return;
      }
      // No house number: a place name ("St. Johnsbury") and a street
      // name ("Granite St") look alike, and the index would return a
      // same-named street in another state for the place. Try the
      // place search first — a known place wins — and only then the
      // address index.
      searchPlace(t, function () { geocodeAndFly(t); });
      return;
    }
    searchPlace(t);
  }
  document.getElementById("map-search").addEventListener("submit", function (e) {
    e.preventDefault();
    goTo(gotoInput.value);
  });

  map.on("error", function (e) {
    var msg = (e && e.error && e.error.message) || "unknown map error";
    if (/\/static\/vendor\/glyphs\//i.test(msg)) return;
    if (basemapStatus.hidden) {
      showBasemapStatus("Map data could not load. Try another style.");
    }
  });

  // Pins are laptop-only: a shared (hotspot) client gets no pin
  // sync and no pins panel (and no Add-pin button). The server 403s
  // /api/pins for them; skipping sync here is the second layer.
  var localMapPage = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
  if (localMapPage) {
    // Load pins from the hub first (server is the source of truth);
    // sync() falls back to this browser's cache when the hub is
    // unreachable, and migrates local pins to the server on first run.
    mk1Pins.sync().then(loadPins).catch(loadPins);
    loadDrawings();
  } else {
    pinsBox.style.display = "none";
    pinBtn.style.display = "none";
    dirPanel.style.display = "none";
    drawingsBox.style.display = "none";
    drawModeBtn.style.display = "none";
  }
  // Repeaters are public infrastructure, not household data, so the
  // layer loads for every client — localhost and shared alike — and
  // the panel above is never hidden here, unlike pins/drawings.
  loadRepeaters();
  window.addEventListener("storage", event => {
    if (!localMapPage) return;
    if (!event.key || event.key === mk1Pins.key) loadPins();
  });
})();
</script>
</body>
</html>

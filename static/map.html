<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pandora's Box Mk1 — offline map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="128x128" href="/static/brand/pandora.png?v=2">
<link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
<style>
  @font-face {
    font-family: 'Inter'; src: url('/static/brand/inter.woff2') format('woff2');
    font-style: normal; font-weight: 100 900; font-display: swap;
  }
  :root {
    --dur-fast: 100ms;
    --dur-normal: 150ms;
    --dur-slow: 250ms;
    --dur-enter: 200ms;
    --ease-standard: cubic-bezier(0.2,0,0,1);
    --ease-enter: cubic-bezier(0,0,0.2,1);
    --ease-emph-enter: cubic-bezier(0.05,0.7,0.1,1);
    --accent: #AAB8ED;
    --bg: #10141D;
    --canvas: #111726;
    --panel: #171E2B;
    --panel2: #1E2736;
    --line: #2C384A;
    --text: #EDF0F7;
    --muted: #C1CADC;
    --faint: #9BA9C0;
    --danger: #E53935;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  /* MapLibre controls restyled to the app's tokens: dark surface, 1px
     border, sharp corners — the default light-grey rounded controls are
     the single biggest "bolted on" tell inside a dark UI. */
  .maplibregl-ctrl-group {
    background: rgba(23,30,43,.92) !important;
    border: 1px solid #2C384A;
    border-radius: 6px !important;
    box-shadow: none !important;
    overflow: hidden;
  }
  .maplibregl-ctrl-group button {
    background: transparent !important;
    border: none !important;
    border-bottom: 1px solid rgba(255,255,255,.08) !important;
    width: 30px !important; height: 30px !important;
    transition: background var(--dur-normal) var(--ease-standard);
  }
  .maplibregl-ctrl-group button:last-child { border-bottom: none !important; }
  .maplibregl-ctrl-group button:hover { background: rgba(170,184,237,.10) !important; }
  .maplibregl-ctrl-group button:active { background: rgba(170,184,237,.18) !important; }
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(0.85); }
  .maplibregl-ctrl-attrib { background: rgba(23,30,43,.85) !important; color: #C1CADC !important; font: 11px ui-monospace, Menlo, Consolas, monospace !important; }
  .maplibregl-ctrl-attrib a { color: var(--accent) !important; }
  #map-hud {
    position: absolute; top: 10px; left: 10px; right: 52px; z-index: 2;
    pointer-events: none;
  }
  #toolbar {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: fit-content; max-width: 100%;
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  #toolbar a, #toolbar button, #goto, #status, #basemap-status, #zoom-status { pointer-events: auto; }
  #toolbar a, #toolbar button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    font: 600 13px/1 Inter, system-ui, sans-serif;
    padding: 8px 11px; cursor: pointer; text-decoration: none;
    transition: background var(--dur-normal) var(--ease-standard), border-color var(--dur-normal) var(--ease-standard), color var(--dur-normal) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
  }
  #toolbar a:hover, #toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  #toolbar.map-unavailable > :not(#map-home) { display: none; }
  #toolbar a:active, #toolbar button:active { transform: scale(0.97); }
  /* Map look (2026-11-24): one control for the map style, Dark the
     main map. The ATAK area picker only shows for the ATAK style. */
  .tb-group {
    display: inline-flex; align-items: center; gap: 6px;
    pointer-events: auto;
  }
  #map-look, #trex-layer {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    font: 600 13px/1 Inter, system-ui, sans-serif;
    padding: 8px 6px; cursor: pointer; pointer-events: auto;
  }
  #map-look:focus, #trex-layer:focus { border-color: var(--accent); outline: none; }
  /* Zoom + coverage status: one plain line under the toolbar, so the
     owner can see why the map stops zooming or what a layer covers. */
  #zoom-status {
    width: fit-content; max-width: min(560px, 100%); margin-top: 8px;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--line); border-radius: 8px;
    font: 12px/1.4 system-ui, sans-serif; padding: 6px 10px;
    pointer-events: auto;
  }
  #toolbar button.active { background: var(--accent); color: #111726; border-color: var(--accent); }
  .tb-label {
    color: #C1CADC; font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 1px; text-transform: uppercase; padding: 0 2px 0 6px;
  }
  #map-search { display: flex; gap: 6px; max-width: 100%; }
  #goto {
    background: var(--canvas); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    font: 13px/1 ui-monospace, Menlo, Consolas, monospace;
    padding: 8px 10px; width: 230px; min-width: 0; outline: none;
    transition: border-color var(--dur-normal) var(--ease-standard), box-shadow var(--dur-normal) var(--ease-standard);
  }
  #goto::placeholder { color: #C1CADC; }
  #goto:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(170,184,237,.18); }
  #status, #basemap-status {
    width: fit-content; max-width: min(420px, 100%); margin-top: 8px;
    background: var(--panel); color: var(--accent);
    border: 1px solid var(--line); border-radius: 8px;
    font: 13px/1.4 system-ui, sans-serif; padding: 8px 10px;
    overflow-wrap: anywhere;
    animation: fadeUp var(--dur-enter) var(--ease-enter) both;
  }
  #status { display: none; }
  #status a { color: var(--accent); }
  /* -- pins ----------------------------------------------------------- */
  #pins {
    position: absolute; left: 10px; bottom: 12px; z-index: 2;
    background: rgba(13, 17, 23, 0.94); color: #EDF0F7;
    border: 1px solid #2C384A; border-radius: 12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    width: 320px; max-width: calc(100% - 20px);
    display: none;
    animation: fadeUp var(--dur-enter) var(--ease-enter) both;
  }
  #pins h3, #directions-panel h3 {
    margin: 0; padding: 9px 12px; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent);
    border-bottom: 1px solid rgba(255,255,255,.12);
    display: flex; justify-content: space-between; align-items: center;
  }
  #pins h3 button, #directions-panel h3 button {
    background: none; border: none; color: #C1CADC; cursor: pointer;
    font: 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1px;
  }
  #pins h3 button:hover, #directions-panel h3 button:hover { color: var(--accent); }
  /* Directions is its own panel (2026-11-24), separate from Saved
     Pins, bottom-right so the two panels never overlap. */
  #directions-panel {
    position: absolute; right: 10px; bottom: 12px; z-index: 2;
    background: rgba(13, 17, 23, 0.94); color: #EDF0F7;
    border: 1px solid #2C384A; border-radius: 12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    width: 320px; max-width: calc(100% - 20px);
    animation: fadeUp var(--dur-enter) var(--ease-enter) both;
  }
  #directions-panel.collapsed #directions { display: none; }
  /* Saved Pins hides separately from Directions, same pattern:
     the toggle collapses just the pin list (the header, with the
     toggle itself, stays visible so it can be shown again). */
  #pins.collapsed #pinlist { display: none; }
  /* Narrow viewports (under ~660px): the two bottom panels are each
     320px wide, so side by side they would overlap. Stack them —
     directions at the bottom (capped so it cannot grow into the
     pins panel), pins above it. */
  @media (max-width: 680px) {
    #pins, #directions-panel { left: 10px; right: 10px; width: auto; }
    #directions-panel { bottom: 12px; max-height: 280px; overflow-y: auto; }
    #pins { bottom: 300px; }
  }
  #pinlist { max-height: 180px; overflow-y: auto; }
  .pinrow {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; font-size: 13px; cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,.06);
    transition: background var(--dur-normal) var(--ease-standard);
  }
  .pinrow:hover { background: rgba(255,255,255,.05); }
  .pinrow .coords { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pinrow button.coords { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .pinrow .del { color: #C1CADC; background: none; border: none; cursor: pointer; font-size: 14px; padding: 0 2px; }
  .pinrow .del:hover { color: #E53935; }
  .mkpin {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid #111726;
    box-shadow: 0 0 0 2px var(--accent); cursor: pointer;
  }
  /* -- directions: straight-line distance + bearing to a saved house -- */
  #directions {
    padding: 9px 12px 12px;
  }
  #directions label {
    display: block; font-size: 12px; color: #C1CADC; margin: 0 0 6px;
  }
  #directions select, #directions input[type="text"] {
    width: 100%; box-sizing: border-box; margin-top: 3px;
    background: #171E2B; color: #EDF0F7; border: 1px solid #2C384A;
    border-radius: 6px; padding: 6px 8px;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
  }
  #directions select:focus, #directions input[type="text"]:focus {
    border-color: var(--accent); outline: none;
  }
  #directions .dir-actions { display: flex; gap: 8px; margin: 2px 0 6px; }
  #directions .dir-actions button {
    background: #171E2B; color: #EDF0F7; border: 1px solid #2C384A;
    border-radius: 6px; padding: 6px 10px; cursor: pointer;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
  }
  #directions .dir-actions button:hover { border-color: var(--accent); }
  #directions .dir-actions button:disabled { opacity: .45; cursor: default; }
  #dir-status { margin: 0; font-size: 12px; line-height: 1.5; color: #EDF0F7; }
  #dir-status:empty { display: none; }
  #dir-turns { margin: 8px 0 0; padding-left: 20px; font-size: 12px; line-height: 1.6; color: #EDF0F7; }
  #dir-turns:empty { display: none; }
  #dir-turns .dist { color: #C1CADC; }
  /* -- drawings: grid-down planning marks -------------------------- */
  /* The drawings panel lives in the map HUD (top-left, under the
     toolbar and status lines) so it never collides with the
     bottom-left pins or bottom-right directions panels. It is a
     normal HUD child: pointer-events auto, same 320px panel look.
     On paper it is hidden with the rest of the HUD — but the drawn
     shapes are map layers, so they still print on the map itself. */
  #drawings {
    pointer-events: auto;
    background: rgba(13, 17, 23, 0.94); color: #EDF0F7;
    border: 1px solid #2C384A; border-radius: 12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    width: 320px; max-width: calc(100% - 20px);
    margin-top: 8px;
    animation: fadeUp var(--dur-enter) var(--ease-enter) both;
  }
  #drawings h3 {
    margin: 0; padding: 9px 12px; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent);
    border-bottom: 1px solid rgba(255,255,255,.12);
    display: flex; justify-content: space-between; align-items: center;
  }
  #drawings h3 button {
    background: none; border: none; color: #C1CADC; cursor: pointer;
    font: 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1px;
  }
  #drawings h3 button:hover { color: var(--accent); }
  #drawings.collapsed #drawings-body { display: none; }
  #drawings-body { padding: 9px 12px 12px; }
  /* Type filters: one chip per resource type. A hidden type is
     dimmed and its items leave the map; the list keeps them, so
     the toggle is reversible at a glance. */
  #draw-type-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .draw-type-chip {
    background: #171E2B; color: #EDF0F7; border: 1px solid #2C384A;
    border-radius: 12px; padding: 4px 8px; cursor: pointer;
    font: 11px ui-monospace, Menlo, Consolas, monospace;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .draw-type-chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .draw-type-chip.off { opacity: .45; }
  .draw-type-chip.off .dot { background: #555 !important; }
  /* The label/type form: shown while a shape is pending (or being
     edited); hidden otherwise. */
  #draw-form { margin-bottom: 8px; }
  #draw-form label { display: block; font-size: 12px; color: #C1CADC; margin: 0 0 6px; }
  #draw-form input[type="text"], #draw-form select {
    width: 100%; box-sizing: border-box; margin-top: 3px;
    background: #171E2B; color: #EDF0F7; border: 1px solid #2C384A;
    border-radius: 6px; padding: 6px 8px;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
  }
  #draw-form input[type="text"]:focus, #draw-form select:focus { border-color: var(--accent); outline: none; }
  #draw-form .draw-form-actions { display: flex; gap: 8px; margin-top: 2px; }
  #draw-form .draw-form-actions button {
    background: #171E2B; color: #EDF0F7; border: 1px solid #2C384A;
    border-radius: 6px; padding: 6px 10px; cursor: pointer;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
  }
  #draw-form .draw-form-actions button:hover { border-color: var(--accent); }
  #draw-list { max-height: 180px; overflow-y: auto; }
  .drawrow {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .drawrow .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .drawrow .draw-info {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .drawrow .draw-info .draw-type { color: #C1CADC; font-size: 11px; }
  .drawrow button.draw-edit, .drawrow button.draw-del {
    background: none; border: none; color: #C1CADC; cursor: pointer;
    font: 12px ui-monospace, Menlo, Consolas, monospace; padding: 0 2px;
  }
  .drawrow button.draw-edit:hover { color: var(--accent); }
  .drawrow button.draw-del:hover { color: #E53935; }
  #draw-empty { margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: #C1CADC; }
  /* -- repeaters: ham/GMRS + public MeshCore ---------------------- */
  /* Same 320px HUD panel look as drawings, under it in the HUD.
     Unlike pins/drawings/directions this panel is NOT localhost-
     only: repeater data is public infrastructure, so a shared
     (hotspot) client keeps the panel and the layer. The list
     reuses the drawings chip/row classes, so no second set of
     list styles. */
  #repeaters {
    pointer-events: auto;
    background: rgba(13, 17, 23, 0.94); color: #EDF0F7;
    border: 1px solid #2C384A; border-radius: 12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    width: 320px; max-width: calc(100% - 20px);
    margin-top: 8px;
    animation: fadeUp var(--dur-enter) var(--ease-enter) both;
  }
  #repeaters h3 {
    margin: 0; padding: 9px 12px; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent);
    border-bottom: 1px solid rgba(255,255,255,.12);
    display: flex; justify-content: space-between; align-items: center;
  }
  #repeaters h3 button {
    background: none; border: none; color: #C1CADC; cursor: pointer;
    font: 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1px;
  }
  #repeaters h3 button:hover { color: var(--accent); }
  #repeaters.collapsed #repeaters-body { display: none; }
  #repeaters-body { padding: 9px 12px 12px; }
  #rep-type-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #rep-list { max-height: 180px; overflow-y: auto; }
  #rep-empty { margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: #C1CADC; }
  #rep-foot { margin: 8px 0 0; font-size: 11px; line-height: 1.5; color: #C1CADC; }
  /* Detail card (MapLibre popup): same dark panel look as the HUD,
     so the card never renders as a white box on the dark map. */
  .maplibregl-popup-content {
    background: rgba(13, 17, 23, 0.96); color: #EDF0F7;
    border: 1px solid #2C384A; border-radius: 12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .maplibregl-popup-close-button { color: #C1CADC; }
  .rep-card { font-size: 12px; line-height: 1.6; }
  .rep-card h4 { margin: 0 0 4px; font-size: 13px; color: var(--accent); }
  .rep-card a { color: var(--accent); }
  .rep-card .rep-key { word-break: break-all; }
  .rep-card .rep-note { color: #C1CADC; }
  .rep-card button.rep-copy {
    background: #171E2B; color: #EDF0F7; border: 1px solid #2C384A;
    border-radius: 6px; padding: 2px 8px; cursor: pointer;
    font: 11px ui-monospace, Menlo, Consolas, monospace;
  }
  .rep-card button.rep-copy:hover { border-color: var(--accent); }
  /* Draw tools row in the toolbar: only visible in draw mode. */
  #draw-tools { display: inline-flex; gap: 6px; align-items: center; }
  #draw-tools[hidden] { display: none; }
  /* reduced motion: kill-switch, mandatory */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important; scroll-behavior: auto !important;
    }
  }
  /* -- print: map + directions on paper ------------------------------ */
  /* The map is a WebGL canvas: without preserveDrawingBuffer (set on
     the Map constructor below) the printed map comes out blank, so
     the print rules below only work together with that option.
     Screen look is untouched; print is dark text on white. */
  #print-header, #print-header span { display: none; }
  @media print {
    @page { size: landscape; margin: 12mm; }
    @page directions { size: portrait; margin: 14mm; }
    html, body { background: #fff !important; color: #000; height: auto; }
    #print-header {
      display: block; margin: 0 0 8px;
      font: 700 16px/1.3 Inter, system-ui, sans-serif; color: #000;
    }
    /* Navigation chrome and interactive controls make no sense on paper. */
    #map-hud, .maplibregl-ctrl-group, .maplibregl-ctrl-attrib,
    #pins h3 button, #directions-panel h3 button, .pinrow .del,
    #directions label, #directions .dir-actions { display: none !important; }
    #map { position: static !important; height: 58vh; width: 100%; }
    /* Stretch the rendered canvas to fill the print box: the canvas
       keeps its on-screen pixel size through the print, so without
       this the map prints small with white space around it. */
    #map canvas { width: 100% !important; height: 100% !important; }
    /* The pins panel only prints when it has something to show: saved
       pins, or an active route. The form itself never prints. */
    #pins:not(.has-pins) { display: none !important; }
    #directions-panel:not(.has-directions) { display: none !important; }
    #pins, #directions-panel {
      position: static !important; display: block !important;
      width: 100%; max-width: none; max-height: none; overflow: visible; margin: 10px 0 0;
      background: #fff !important; color: #000;
      border: 1px solid #999; border-radius: 0;
    }
    #pins h3, #directions-panel h3 { color: #000; }
    #pinlist { max-height: none; overflow: visible; }
    #directions, #dir-status, #dir-turns { color: #000; }
    /* The status line only prints with a route: otherwise it holds the
       on-screen "type both addresses" hint, which is noise on paper. */
    #dir-status { display: none; }
    #directions-panel.has-directions #dir-status { display: block; }
    /* A collapsed panel still prints its route: the screen collapse
       hides #directions, but on paper the route is the point. */
    #directions-panel.collapsed #directions { display: block; }
    #pins.collapsed #pinlist { display: block; }
    #dir-turns .dist { color: #333; }
    body[data-print="map"] #pins, body[data-print="map"] #directions-panel,
    body[data-print="directions"] :is(#map, #pins, #directions-panel > h3) { display: none !important; }
    body[data-print="directions"] { page: directions; }
    body[data-print="directions"] #directions-panel { border: 0; padding: 0; margin: 0; max-height: none; overflow: visible; }
    body[data-print="directions"] :is(#dir-status, #dir-turns) { font-size: 13px; }
    body[data-print="directions"] #dir-turns li { break-inside: avoid; }
    body[data-print="map"] #print-map-title,
    body[data-print="directions"] #print-directions-title,
    body:not([data-print]) #print-combined-title { display: inline; }
  }
</style>
</head>
<body>
<div id="print-header">Pandora&rsquo;s Box Mk1 &mdash;
  <span id="print-map-title">Map</span><span id="print-directions-title">Directions</span><span id="print-combined-title">Map and directions</span>
</div>
<div id="map"></div>
<div id="map-hud">
  <div id="toolbar">
    <a id="map-home" href="/">Home</a>
    <!-- Map look (2026-11-24): one control. Dark is the main map
         (whole-US street map); the rest are alternatives, labeled
         by purpose. The base map is always the US (CONUS) extract —
         the New England option is gone, so the owner cannot land
         on just New England. -->
    <label class="tb-group" for="map-look"><span class="tb-label">Map look</span>
      <select id="map-look" aria-label="Map look">
        <option value="dark" selected>Dark — main map</option>
        <option value="light">Light — street map</option>
        <option value="topo">Topo — terrain (Northeast only)</option>
        <option value="trex">ATAK — tactical (Northeast only)</option>
      </select>
    </label>
    <!-- ATAK-LAYERS (2026-11-22): area picker for the ATAK style.
         Options come from /api/map-config (trex_layers); the group
         only shows while ATAK is the active style. -->
    <span class="tb-group" id="trex-layer-group" hidden><span class="tb-label">ATAK area</span>
      <select id="trex-layer" aria-label="ATAK area"></select>
    </span>
    <button id="pinmode">Add pin</button>
    <button id="draw-mode" type="button">Draw</button>
    <span id="draw-tools" hidden>
      <button type="button" data-tool="marker">Marker</button>
      <button type="button" data-tool="line">Line</button>
      <button type="button" data-tool="polygon">Area</button>
      <button type="button" data-tool="circle">Circle</button>
      <button id="draw-done" type="button">Done</button>
      <button id="draw-cancel" type="button">Cancel</button>
    </span>
    <button id="print-map" type="button">Print map</button>
    <form id="map-search" role="search" aria-label="Find a place on the map">
      <input id="goto" type="text" aria-label="Place, address, or coordinates" placeholder="Place, address, or lat/lon" autocomplete="off">
      <button id="gobtn" type="submit">Go</button>
    </form>
  </div>
  <div id="basemap-status" role="status" hidden></div>
  <div id="status" role="status"></div>
  <div id="zoom-status" role="status"></div>
  <div id="drawings">
    <h3>Drawn items <button id="drawings-toggle" type="button" aria-expanded="true">Hide</button></h3>
    <div id="drawings-body">
      <div id="draw-type-filters" aria-label="Show or hide by type"></div>
      <div id="draw-form" hidden>
        <label>Label <input id="draw-label" type="text" placeholder="e.g. Well by the oak" autocomplete="off" maxlength="200"></label>
        <label>Type <select id="draw-type" aria-label="Resource type"></select></label>
        <div class="draw-form-actions">
          <button id="draw-save" type="button">Save</button>
          <button id="draw-form-cancel" type="button">Cancel</button>
        </div>
      </div>
      <div id="draw-list"></div>
      <p id="draw-empty">No drawn items yet — use Draw to mark water, food, fuel, shelter, and rally points.</p>
    </div>
  </div>
  <div id="repeaters">
    <h3>Repeaters <button id="repeaters-toggle" type="button" aria-expanded="true">Hide</button></h3>
    <div id="repeaters-body">
      <div id="rep-type-filters" aria-label="Show or hide repeater types"></div>
      <div id="rep-list"></div>
      <p id="rep-empty">Loading repeaters…</p>
      <p id="rep-foot"></p>
    </div>
  </div>
</div>
<div id="pins">
  <h3>Pins <span><button id="pins-toggle" type="button" aria-expanded="true">Hide</button> <button id="clearpins">Clear all</button></span></h3>
  <div id="pinlist"></div>
</div>
<div id="directions-panel">
  <h3>Directions <button id="dir-toggle" type="button" aria-expanded="true">Hide</button></h3>
  <div id="directions">
    <label>From
      <select id="dir-from" aria-label="Starting point"></select>
    </label>
    <label>Or type a starting address
      <input id="dir-from-addr" type="text" placeholder="e.g. 123 Main St" autocomplete="off">
    </label>
    <label>To a saved place
      <select id="dir-to" aria-label="Destination"></select>
    </label>
    <label>Or type a destination address
      <input id="dir-to-addr" type="text" placeholder="e.g. 55 Fogg Rd, Weymouth" autocomplete="off">
    </label>
    <div class="dir-actions">
      <button id="dir-go" type="button">Show directions</button>
      <button id="dir-clear" type="button">Clear</button>
      <button id="dir-print" type="button" disabled>Print directions</button>
    </div>
    <p id="dir-status" role="status"></p>
    <ol id="dir-turns"></ol>
  </div>
</div>
<script src="/static/vendor/pmtiles.js"></script>
<script src="/static/vendor/maplibre-gl.js"></script>
<script src="/static/pins.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var readiness = window.parent !== window && params.get("readiness") === "1";
  if (readiness) document.getElementById("map-hud").hidden = true;
  function printView(view) {
    document.body.dataset.print = view;
    window.print();
  }
  window.addEventListener("afterprint", function () { delete document.body.dataset.print; });
  var printDirections = document.getElementById("dir-print");
  document.getElementById("print-map").addEventListener("click", function () { printView("map"); });
  printDirections.addEventListener("click", function () { printView("directions"); });
  function reportReadiness(ok, detail) {
    window.parent.postMessage({ type: "mk1-map-readiness", ok: ok, detail: detail }, location.origin);
  }
  function mapNumber(key, min, max) {
    var raw = params.get(key)?.trim();
    var value = raw ? Number(raw) : NaN;
    return Number.isFinite(value) && value >= min && value <= max ? value : null;
  }
  var requestedLat = mapNumber("lat", -90, 90);
  var lat = requestedLat ?? 39.8283;
  var lon = mapNumber("lon", -180, 180) ?? -98.5795;
  var hasPlace = requestedLat !== null;
  // The base map is always the whole-US (CONUS) extract. The New
  // England option is gone (2026-11-24): the owner kept landing on
  // just New England and thinking the whole-US map was missing.
  // The hub serves /tiles/* with HTTP Range support, which
  // pmtiles.js needs.
  var src = "/tiles/conus.pmtiles";
  // New England bounds (from the NE extract header) and centre, for
  // the Topo default view and the Topo switch fly-to.
  var NE_BOUNDS = [-73.73, 40.98, -66.95, 47.47]; // [west, south, east, north]
  var NE_CENTER = [-71.5, 43.5]; // [lon, lat]
  var TREX_MIN_ZOOM = 12;
  var TREX_MAX_ZOOM = 15;
  var TOPO_MAX_ZOOM = 12;
  var mapLook = document.getElementById("map-look");
  var requestedStyle = params.get("style");
  var currentStyle = ["dark", "light", "topo", "trex"].indexOf(requestedStyle) >= 0
    ? requestedStyle : "dark";
  mapLook.value = currentStyle;
  var currentVectorKey = currentStyle === "light" ? "light" : "dark";
  // Default view is the whole US (zoom 4). A place link without an
  // explicit zoom gets a closer look (10); Topo only covers New
  // England, so its default view is New England at zoom 7.
  var DEFAULT_ZOOM = 4;
  var requestedZoom = mapNumber("zoom", 0, 22);
  var zoom = requestedZoom ?? (hasPlace ? 10 : (currentStyle === "topo" ? 7 : DEFAULT_ZOOM));

  var status = document.getElementById("status");
  var basemapStatus = document.getElementById("basemap-status");
  var availabilityRequest;
  // Escape messages that include map errors or text from place search.
  // Null/undefined escape to '' (same as ui.html), not "null".
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // showStatus is an HTML sink: it sets innerHTML exactly as given.
  // Callers must pass already-escaped strings (esc() any user text
  // first) or static markup — never raw user input.
  function showStatus(html) {
    status.innerHTML = html;
    status.style.display = "block";
  }
  function hideStatus() { status.style.display = "none"; }

  function showBasemapStatus(message) {
    basemapStatus.textContent = message;
    basemapStatus.hidden = !message;
  }

  function checkBasemap() {
    if (availabilityRequest) availabilityRequest.abort();
    var request = new AbortController();
    availabilityRequest = request;
    var style = currentStyle;
    var key = style === "topo" || style === "trex" ? style : "vector";
    var label = key === "topo" ? "Topo" : key === "trex" ? "ATAK" : "US";
    showBasemapStatus("");
    fetch("/api/maps/availability?" + new URLSearchParams({ src: src }), {
      cache: "no-store",
      signal: request.signal
    }).then(function (response) {
      if (!response.ok) throw new Error("Map availability request failed");
      return response.json();
    }).then(function (assets) {
      if (request.signal.aborted || assets[key]) return;
      showBasemapStatus(label + " map data is missing. Try another style.");
    }).catch(function () {
      if (!request.signal.aborted && basemapStatus.hidden) {
        showBasemapStatus("Could not check offline map files. Try reloading the map.");
      }
    });
  }

  var protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  // Vector styles (dark / light) over the Protomaps extract. The topo
  // style is a raster layer of real USGS topo tiles, downloaded into
  // maps_dir/topo/ — not a recolour of the vector data.
  function baseStyle(name) {
    return {
      "version": 8,
      "name": name,
      "glyphs": "/static/vendor/glyphs/{fontstack}/{range}.pbf",
      "sources": {
        "protomaps": {
          "type": "vector",
          "url": "pmtiles://" + src,
          "attribution": "OpenStreetMap contributors"
        }
      },
      "layers": []
    };
  }

  function layersFor(p) {
    return [
      { "id": "background", "type": "background",
        "paint": { "background-color": p.bg } },
      { "id": "landuse-park", "type": "fill", "source": "protomaps",
        "source-layer": "landuse",
        "filter": ["match", ["get", "kind"], ["park", "national_park", "forest"], true, false],
        "paint": { "fill-color": p.park, "fill-opacity": 0.9 } },
      { "id": "water", "type": "fill", "source": "protomaps",
        "source-layer": "water",
        "paint": { "fill-color": p.water } },
      { "id": "waterway", "type": "line", "source": "protomaps",
        "source-layer": "waterway",
        "paint": { "line-color": p.water, "line-width": 1 } },
      { "id": "roads-minor", "type": "line", "source": "protomaps",
        "source-layer": "roads", "minzoom": 10,
        "paint": { "line-color": p.roadMinor, "line-width": 1 } },
      { "id": "roads-major", "type": "line", "source": "protomaps",
        "source-layer": "roads", "minzoom": 7,
        "filter": ["match", ["get", "kind"], ["highway", "major_road"], true, false],
        "paint": { "line-color": p.roadMajor, "line-width": 2 } },
      { "id": "buildings", "type": "fill", "source": "protomaps",
        "source-layer": "buildings", "minzoom": 13,
        "paint": { "fill-color": p.building, "fill-opacity": 0.9 } },
      { "id": "boundaries", "type": "line", "source": "protomaps",
        "source-layer": "boundaries",
        "paint": { "line-color": p.boundary, "line-width": 1,
                   "line-dasharray": [4, 2] } },
      { "id": "places", "type": "symbol", "source": "protomaps",
        "source-layer": "places", "minzoom": 8,
        "filter": ["match", ["get", "kind"], ["locality", "region", "country"], true, false],
        "layout": { "text-field": ["get", "name"],
                    "text-font": ["Noto Sans Regular"],
                    "text-size": 13, "text-anchor": "center" },
        "paint": { "text-color": p.label,
                   "text-halo-color": p.halo, "text-halo-width": 1 } }
    ];
  }

  var PALETTES = {
    dark: {
      bg: "#050709", park: "#0d1a16", water: "#0e1e28",
      roadMinor: "#21262D", roadMajor: "#8a919c",
      building: "#161B22", boundary: "#2d333b",
      label: "#F7F9FC", halo: "#050709"
    },
    light: {
      bg: "#e8e4dc", park: "#c2d9b0", water: "#a8c8e0",
      roadMinor: "#ffffff", roadMajor: "#00647f",
      building: "#c8c0b8", boundary: "#a8a090",
      label: "#222222", halo: "#ffffff"
    }
  };

  function makeVectorStyle(key) {
    var s = baseStyle("Pandora's Box Mk1 — " + key);
    s.layers = layersFor(PALETTES[key] || PALETTES.dark);
    return s;
  }

  function makeTopoStyle() {
    return {
      "version": 8,
      "name": "Pandora's Box Mk1 — USGS topo",
      "sources": {
        "topo": {
          "type": "raster",
          "tiles": ["/tiles/topo/{z}/{x}/{y}.jpg"],
          "tileSize": 256,
          "maxzoom": TOPO_MAX_ZOOM,
          "attribution": "USGS"
        }
      },
      "layers": [
        { "id": "background", "type": "background",
          "paint": { "background-color": "#e8e4dc" } },
        { "id": "topo", "type": "raster", "source": "topo" }
      ]
    };
  }

  // ATAK layers: the T.REX Braintree export (25 MB MBTiles, z12-z15,
  // JPEG) plus USGS topo MBTiles for Massachusetts (z12-z15) and New
  // England (z10-z12). Each layer covers its own area, so switching
  // to ATAK also flies to the selected layer's centre — anywhere
  // else would be blank. Centres, bounds and the layer list come
  // from the hub (/api/map-config, localhost-only); a shared client,
  // or a failed fetch, falls back to a generic CONUS centre, so the
  // served page never embeds the covered area.
  var trexCenter = null; // [lon, lat]
  var trexBounds = null; // [west, south, east, north]
  // ATAK-LAYERS (2026-11-22): layers from /api/map-config
  // (trex_layers); trexLayer is the selected one, or null when no
  // layer list arrived (shared client) — then the legacy
  // first-layer tile URL stands.
  var trexLayers = [];
  var trexLayer = null;
  fetch("/api/map-config", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("map-config unavailable");
      return r.json();
    })
    .then(function (cfg) {
      if (Array.isArray(cfg.trex_center) && cfg.trex_center.length === 2) trexCenter = cfg.trex_center;
      if (Array.isArray(cfg.trex_bounds) && cfg.trex_bounds.length === 2) {
        trexBounds = [cfg.trex_bounds[0][0], cfg.trex_bounds[0][1],
                      cfg.trex_bounds[1][0], cfg.trex_bounds[1][1]];
      }
      // ATAK-LAYERS (2026-11-22): build the area picker from the
      // layer list; the first layer (Braintree) stays the default.
      if (Array.isArray(cfg.trex_layers) && cfg.trex_layers.length) {
        trexLayers = cfg.trex_layers;
        trexLayer = trexLayers[0];
        if (Array.isArray(trexLayer.center)) trexCenter = trexLayer.center;
        if (Array.isArray(trexLayer.bounds)) {
          trexBounds = [trexLayer.bounds[0][0], trexLayer.bounds[0][1],
                        trexLayer.bounds[1][0], trexLayer.bounds[1][1]];
        }
        var sel = document.getElementById("trex-layer");
        trexLayers.forEach(function (layer) {
          var opt = document.createElement("option");
          opt.value = layer.id;
          opt.textContent = layer.label || layer.id;
          sel.appendChild(opt);
        });
        updateTrexLayerVisibility();
        sel.addEventListener("change", function () {
          var picked = trexLayers.filter(function (l) { return l.id === sel.value; })[0];
          if (!picked) return;
          trexLayer = picked;
          if (Array.isArray(picked.center)) trexCenter = picked.center;
          if (Array.isArray(picked.bounds)) {
            trexBounds = [picked.bounds[0][0], picked.bounds[0][1],
                          picked.bounds[1][0], picked.bounds[1][1]];
          }
          if (typeof map !== "undefined" && map && currentStyle === "trex") {
            map.setStyle(makeTrexStyle());
            applyZoomLimits();
            updateZoomStatus();
            map.flyTo({ center: trexCenter, zoom: trexFlyZoom(picked.zoom || 14), duration: 400, essential: true });
          }
        });
      }
      if (typeof map !== "undefined" && map && currentStyle === "trex" && trexCenter) {
        map.setStyle(makeTrexStyle());
        applyZoomLimits();
        updateZoomStatus();
        map.flyTo({ center: trexCenter, zoom: trexFlyZoom(trexLayer ? (trexLayer.zoom || 14) : 14), duration: 400, essential: true });
      }
    })
    .catch(function () { /* shared client, or the hub has no endpoint: the generic centre stands */ });
  function makeTrexStyle() {
    // ATAK-LAYERS (2026-11-22): one raster source for the selected
    // layer; without a layer the legacy first-layer URL stands.
    // The vector street map sits underneath the raster (2026-11-24),
    // so zooming out past the layer — or panning outside its
    // coverage — shows the street map instead of a black void.
    var layer = trexLayer;
    var trexSource = {
      "type": "raster",
      "tiles": [layer ? "/tiles/trex/" + layer.id + "/{z}/{x}/{y}.jpg" : "/tiles/trex/{z}/{x}/{y}.jpg"],
      "tileSize": 256,
      "minzoom": layer ? (layer.minzoom == null ? TREX_MIN_ZOOM : layer.minzoom) : TREX_MIN_ZOOM,
      "maxzoom": layer ? (layer.maxzoom == null ? TREX_MAX_ZOOM : layer.maxzoom) : TREX_MAX_ZOOM,
      "attribution": layer && layer.id.indexOf("usgs-") === 0 ? "USGS" : "T.REX ARMS"
    };
    if (trexBounds) trexSource.bounds = trexBounds;
    var style = makeVectorStyle(currentVectorKey);
    style.name = "Pandora's Box Mk1 — ATAK";
    style.sources.trex = trexSource;
    style.layers.push({ "id": "trex", "type": "raster", "source": "trex" });
    return style;
  }

  function makeStyle(key) {
    if (key === "topo") return makeTopoStyle();
    if (key === "trex") return makeTrexStyle();
    return makeVectorStyle(key);
  }

  function updateHomeLink() {
    var home = new URLSearchParams();
    if (params.has("style")) home.set("style", currentStyle);
    document.getElementById("map-home").href = home.size ? "/?" + home : "/";
  }

  function updateSelectionUrl() {
    var url = new URL(window.location.href);
    url.search = params.toString();
    history.replaceState(null, "", url);
    updateHomeLink();
  }

  updateHomeLink();

  var map;
  try {
    map = new maplibregl.Map({
      container: "map",
      style: makeStyle(currentStyle),
      center: currentStyle === "trex" && requestedLat === null ? (trexCenter || [lon, lat])
        : currentStyle === "topo" && requestedLat === null ? NE_CENTER : [lon, lat],
      zoom: currentStyle === "trex" && requestedZoom === null ? 14 : zoom,
      interactive: !readiness,
      attributionControl: false,
      // Keep the last rendered frame in the WebGL buffer so the map
      // prints: without this, window.print() renders a blank canvas.
      preserveDrawingBuffer: true
    });
    if (!readiness) map.addControl(new maplibregl.NavigationControl(), "top-right");
  } catch {
    if (readiness) reportReadiness(false, "The map renderer could not start. Check browser WebGL support.");
    document.getElementById("toolbar").classList.add("map-unavailable");
    showStatus("Map failed to start. Check that WebGL is enabled, then reload the map.");
    return;
  }
  if (readiness) {
    var raster = currentStyle === "topo" || currentStyle === "trex";
    var centreTile = false;
    var reported = false;
    function finish(ok) {
      if (reported) return;
      reported = true;
      reportReadiness(ok, ok ? "Rendered map data at the test coordinates." :
        "No map data rendered at the test coordinates. Check the installed coverage for this style.");
    }
    map.on("sourcedata", function (event) {
      if (event.sourceId !== (raster ? currentStyle : "protomaps") || !event.tile?.hasData()) return;
      var tile = event.coord?.canonical;
      if (!tile) return;
      var scale = 2 ** tile.z;
      var radians = Math.max(-85.051129, Math.min(85.051129, lat)) * Math.PI / 180;
      var x = Math.min(scale - 1, Math.floor((lon + 180) / 360 * scale));
      var y = Math.max(0, Math.min(scale - 1, Math.floor((1 - Math.asinh(Math.tan(radians)) / Math.PI) / 2 * scale)));
      if (x === tile.x && y === tile.y) centreTile = true;
    });
    map.on("render", function () {
      if (!reported && centreTile && (raster || map.queryRenderedFeatures().length > 0)) finish(true);
    });
    map.once("idle", function () { finish(false); });
    return;
  }
  checkBasemap();

  // Switching style rebuilds the style document and drops custom
  // sources/layers, including the directions line and the drawn
  // items. Re-add both, so the line, the drawings, and the panels
  // stay in agreement.
  map.on("style.load", function () {
    renderDrawings();
    renderRepeaters();
    if (!lastDirections) return;
    if (lastDirections.geometry) addRouteLine(lastDirections.geometry);
    else addDirectionsLine(lastDirections.from, lastDirections.to);
  });

  // -- style switcher ---------------------------------------------------
  // currentStyle tracks the active style key; currentVectorKey tracks
  // the last dark/light style, so switching back from Topo/ATAK
  // returns to it.
  //
  // Dark <-> light swaps the paint properties of the existing layers
  // in place — instant, no style rebuild or tile refetch. setStyle()
  // tears down and rebuilds the whole style document, so it is only
  // used when the layer set itself changes (Topo / ATAK) or the
  // vector layers are not loaded yet (right after Topo/ATAK).
  function applyVectorPalette(key) {
    var p = PALETTES[key] || PALETTES.dark;
    if (!map.getLayer("water")) return false;
    map.setPaintProperty("background", "background-color", p.bg);
    map.setPaintProperty("landuse-park", "fill-color", p.park);
    map.setPaintProperty("water", "fill-color", p.water);
    map.setPaintProperty("waterway", "line-color", p.water);
    map.setPaintProperty("roads-minor", "line-color", p.roadMinor);
    map.setPaintProperty("roads-major", "line-color", p.roadMajor);
    map.setPaintProperty("buildings", "fill-color", p.building);
    map.setPaintProperty("boundaries", "line-color", p.boundary);
    map.setPaintProperty("places", "text-color", p.label);
    map.setPaintProperty("places", "text-halo-color", p.halo);
    return true;
  }
  // -- zoom limits + status --------------------------------------------
  // The map can never show a black or blurry void: ATAK is clamped
  // to its layer's zoom range, Topo cannot zoom past its sharp
  // tiles (12), and the vector styles are free. The status line
  // says the zoom and what the active layer covers.
  function trexZoomRange() {
    var layer = trexLayer;
    return {
      min: layer && layer.minzoom != null ? layer.minzoom : TREX_MIN_ZOOM,
      max: layer && layer.maxzoom != null ? layer.maxzoom : TREX_MAX_ZOOM
    };
  }
  // Clamp a fly-to zoom into the ATAK layer's range, so the target
  // and the clamp never disagree (e.g. zoom 14 on the z10-12 NE layer).
  function trexFlyZoom(z) {
    var r = trexZoomRange();
    return Math.max(r.min, Math.min(z, r.max));
  }
  function applyZoomLimits() {
    if (currentStyle === "trex") {
      var r = trexZoomRange();
      map.setMinZoom(r.min);
      map.setMaxZoom(r.max);
    } else if (currentStyle === "topo") {
      map.setMinZoom(0);
      map.setMaxZoom(TOPO_MAX_ZOOM);
    } else {
      map.setMinZoom(0);
      map.setMaxZoom(22);
    }
  }
  var zoomStatus = document.getElementById("zoom-status");
  function updateZoomStatus() {
    if (!zoomStatus) return;
    var z = Math.round(map.getZoom() * 10) / 10;
    var text;
    if (currentStyle === "trex") {
      var r = trexZoomRange();
      var name = trexLayer ? (trexLayer.label || trexLayer.id) : "ATAK";
      text = "Zoom " + z + " · ATAK — " + name + " (zoom " + r.min + "–" + r.max + ", Northeast only)";
      if (z < r.min || z > r.max) text += " — zoom in to see the ATAK layer";
    } else if (currentStyle === "topo") {
      text = "Zoom " + z + " · Topo — terrain, Northeast only (max zoom 12)";
    } else {
      text = "Zoom " + z + " · " + (currentStyle === "light" ? "Light" : "Dark") + " — whole US";
    }
    zoomStatus.textContent = text;
  }
  var trexLayerGroup = document.getElementById("trex-layer-group");
  function updateTrexLayerVisibility() {
    if (!trexLayerGroup) return;
    trexLayerGroup.hidden = !(currentStyle === "trex" && trexLayers.length > 1);
  }
  function inNewEngland(center) {
    return center.lng >= NE_BOUNDS[0] && center.lng <= NE_BOUNDS[2]
      && center.lat >= NE_BOUNDS[1] && center.lat <= NE_BOUNDS[3];
  }
  mapLook.addEventListener("change", function () {

  // -- pins --------------------------------------------------------------
  // Pins live in the hub (pins.db, /api/pins) — the hub is the source
  // of truth, so they survive a browser clear and a different
  // browser. This browser's localStorage is a fast cache, synced
  // with the server on load (mk1Pins.sync) and on every change
  // (mk1Pins.update pushes to the server).
  var pins = [];
  var pinMarkers = new Map();
  var pinMode = false;
  var pinBtn = document.getElementById("pinmode");
  var pinsBox = document.getElementById("pins");
  var pinList = document.getElementById("pinlist");

  function loadPins() {
    try {
      pins = mk1Pins.read().filter(mk1Pins.valid);
      const wanted = new Set(pins.map(pin => pin.id));
      for (const [id, marker] of pinMarkers) {
        if (!wanted.has(id)) {
          marker.remove();
          pinMarkers.delete(id);
        }
      }
      pins.forEach(pin => {
        let marker = pinMarkers.get(pin.id);
        if (!marker) {
          marker = new maplibregl.Marker({ element: pinEl() });
          pinMarkers.set(pin.id, marker);
          marker.setLngLat([pin.lon, pin.lat]).addTo(map);
        } else {
          marker.setLngLat([pin.lon, pin.lat]);
        }
      });
      renderPins();
      renderDirections();
    } catch (e) {
      showStatus("Could not read saved pins from browser storage.");
    }
  }

  async function changePins(change) {

  function pinEl() {

  function addPin(lat, lon, label, address) {

  // -- directions: road routing with a straight-line fallback --------
  // First tries the hub's road router (/api/route, built from the

  var dirFrom = document.getElementById("dir-from");
  var dirFromAddr = document.getElementById("dir-from-addr");
  var dirTo = document.getElementById("dir-to");
  var dirToAddr = document.getElementById("dir-to-addr");
  var dirGo = document.getElementById("dir-go");
  var dirStatus = document.getElementById("dir-status");
  var dirTurns = document.getElementById("dir-turns");
  var dirPanel = document.getElementById("directions-panel");
  var dirToggle = document.getElementById("dir-toggle");
  // Directions hides separately from Saved Pins: the toggle collapses

  var pinsPanel = document.getElementById("pins");
  var pinsToggle = document.getElementById("pins-toggle");

  pinsToggle.addEventListener("click", function () {

    pinsToggle.setAttribute("aria-expanded", String(!collapsed));
  });
  var DIR_LINE = "directions-line";
  // The active directions, if any — kept so a style change (which
  // rebuilds the style document and drops the line) can re-add it.
  var lastDirections = null;
  var directionsRequest = 0;

  function pinLabel(p) {
    return (p.label ? p.label : "") || (p.address ? p.address : "") || (p.lat.toFixed(5) + ", " + p.lon.toFixed(5));
  }
  function renderDirections() {
    // Rebuild both selects from the saved pins. "From" also offers
    // the map centre; the typed address (if any) overrides it.
    var fromVal = dirFrom.value;
    var toVal = dirTo.value;
    dirFrom.innerHTML = "";
    dirTo.innerHTML = "";
    var centerOpt = document.createElement("option");
    centerOpt.value = "center";
    centerOpt.textContent = "Map centre";
    dirFrom.appendChild(centerOpt);
    pins.forEach(function (p) {
      var o1 = document.createElement("option");
      o1.value = p.id;
      o1.textContent = pinLabel(p);
      dirFrom.appendChild(o1);
      var o2 = document.createElement("option");
      o2.value = p.id;
      o2.textContent = pinLabel(p);
      dirTo.appendChild(o2);
    });
    if (fromVal) dirFrom.value = fromVal;
    if (toVal) dirTo.value = toVal;
    // No saved places yet: the typed address boxes still work, so
    // the button stays enabled — two typed addresses route fine.
    if (lastDirections) return;
    if (pins.length === 0) {
      dirStatus.textContent = "Type both addresses, or save a place first — from the hub's Saved Locations, or drop a pin on this map.";
    } else if (dirStatus.textContent.indexOf("Save a place first") === 0 || dirStatus.textContent.indexOf("Type both addresses") === 0) {
      dirStatus.textContent = "";
    }
  }
  function haversineKm(lat1, lon1, lat2, lon2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function bearingDeg(lat1, lon1, lat2, lon2) {
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
    var x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }
  function compass(b) {
    var dirs = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
    return dirs[Math.round(b / 22.5) % 16];
  }
  function addDirectionsLine(from, to) {
    var line = {
      type: "Feature",
      geometry: { type: "LineString", coordinates: [[from.lon, from.lat], [to.lon, to.lat]] },
    };
    if (map.getSource(DIR_LINE)) {
      map.getSource(DIR_LINE).setData(line);
    } else {
      map.addSource(DIR_LINE, { type: "geojson", data: line });
      map.addLayer({
        id: DIR_LINE, type: "line", source: DIR_LINE,
        paint: { "line-color": "#AAB8ED", "line-width": 3 },
      });
    }
  }
  function addRouteLine(geometry) {
    // geometry is [[lat, lon], ...]; MapLibre wants [lon, lat].
    var coords = geometry.map(function (p) { return [p[1], p[0]]; });
    var line = { type: "Feature", geometry: { type: "LineString", coordinates: coords } };
    if (map.getSource(DIR_LINE)) {
      map.getSource(DIR_LINE).setData(line);
    } else {
      map.addSource(DIR_LINE, { type: "geojson", data: line });
      map.addLayer({
        id: DIR_LINE, type: "line", source: DIR_LINE,
        paint: { "line-color": "#AAB8ED", "line-width": 3 },
      });
    }
  }
  function fitRouteBounds(geometry) {
    var lons = geometry.map(function (p) { return p[1]; });
    var lats = geometry.map(function (p) { return p[0]; });
    map.fitBounds(
      [[Math.min.apply(null, lons), Math.min.apply(null, lats)],
       [Math.max.apply(null, lons), Math.max.apply(null, lats)]],
      { padding: 60, duration: 400, essential: true });
  }
  function renderTurns(legs) {
    dirTurns.innerHTML = "";
    (legs || []).forEach(function (leg) {
      var li = document.createElement("li");
      li.textContent = leg.instruction || "";
      if (leg.distance_m > 0) {
        var span = document.createElement("span");
        span.className = "dist";
        span.textContent = " — " + (leg.distance_m * 0.000621371).toFixed(1) + " mi";
        li.appendChild(span);
      }
      dirTurns.appendChild(li);
    });
  }
  function clearTurns() {
    dirTurns.innerHTML = "";
  }
  function drawDirectionsLine(from, to) {
    addDirectionsLine(from, to);
    map.fitBounds(
      [[Math.min(from.lon, to.lon), Math.min(from.lat, to.lat)],
       [Math.max(from.lon, to.lon), Math.max(from.lat, to.lat)]],
      { padding: 60, duration: 400, essential: true });
  }
  function clearDirectionsLine() {
    lastDirections = null;
    printDirections.disabled = true;
    dirPanel.classList.remove("has-directions");
    clearTurns();
    if (map.getLayer(DIR_LINE)) map.removeLayer(DIR_LINE);
    if (map.getSource(DIR_LINE)) map.removeSource(DIR_LINE);
  }
  function showDirections(from, to, fromName, toName, note) {
    // Straight-line fallback: distance + bearing, never presented
    // as a road route. `note` (when given) says why the road route
    // did not happen.
    if (from.lat === to.lat && from.lon === to.lon) {
      clearDirectionsLine();
      dirPanel.classList.add("has-directions");
      dirStatus.textContent = fromName + " and " + toName + " are the same place — pick a different starting point or destination.";
      return;
    }
    lastDirections = { from: from, to: to, fromName: fromName, toName: toName };
    dirPanel.classList.add("has-directions");
    var km = haversineKm(from.lat, from.lon, to.lat, to.lon);
    var miles = km * 0.621371;
    var b = bearingDeg(from.lat, from.lon, to.lat, to.lon);
    clearTurns();
    drawDirectionsLine(from, to);
    dirStatus.textContent = fromName + " → " + toName + ": " +
      miles.toFixed(1) + " miles (" + km.toFixed(1) + " km), bearing " +
      Math.round(b) + "° (" + compass(b) + ") — straight line, not a road route." +
      (note ? " " + note : "");
    printDirections.disabled = false;
  }
  function showRoute(from, to, fromName, toName, request) {
    // Road route first; any failure falls back to the straight line
    // with the reason attached, so the map never shows nothing.
    if (from.lat === to.lat && from.lon === to.lon) {
      clearDirectionsLine();
      dirPanel.classList.add("has-directions");
      dirStatus.textContent = fromName + " and " + toName + " are the same place — pick a different starting point or destination.";
      return;
    }
    dirStatus.textContent = "Finding a road route…";
    fetch("/api/route?from=" + encodeURIComponent(from.lat + "," + from.lon) +
          "&to=" + encodeURIComponent(to.lat + "," + to.lon), { signal: AbortSignal.timeout(12000) })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (request !== directionsRequest) return;
        if (!res.ok || !res.data || !res.data.legs || !res.data.geometry) {
          showDirections(from, to, fromName, toName,
            res.data && res.data.error ? "(" + res.data.error + ")" : "(Road routing unavailable.)");
          return;
        }
        var data = res.data;
        lastDirections = { from: from, to: to, fromName: fromName, toName: toName, geometry: data.geometry, legs: data.legs };
        dirPanel.classList.add("has-directions");
        addRouteLine(data.geometry);
        fitRouteBounds(data.geometry);
        renderTurns(data.legs);
        var roadMiles = (data.distance_m * 0.000621371).toFixed(1);
        var straightKm = haversineKm(from.lat, from.lon, to.lat, to.lon);
        var mins = Math.round(data.duration_s / 60);
        dirStatus.textContent = fromName + " → " + toName + ": " + roadMiles +
          " road miles, about " + mins + " min" +
          " (straight line " + (straightKm * 0.621371).toFixed(1) + " miles).";
        printDirections.disabled = false;
      })
      .catch(function () {
        if (request === directionsRequest) showDirections(from, to, fromName, toName, "(Road routing request failed.)");
      });
  }
  function findPin(id) {
    for (var i = 0; i < pins.length; i++) {
      if (String(pins[i].id) === String(id)) return pins[i];
    }

  }
  dirGo.addEventListener("click", function () {
    var request = ++directionsRequest;
    clearDirectionsLine();
    dirStatus.textContent = "Finding start and destination…";
    // A typed address overrides the matching select, on either end.
    // Both ends resolve first (address lookup, then pin or centre),
    // then the road router runs; the straight line is the fallback.
    function resolveFrom() {
      var addr = (dirFromAddr.value || "").trim();
      if (addr) {
        return fetch("/api/geocode?q=" + encodeURIComponent(addr), { signal: AbortSignal.timeout(8000) })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var res = (data.results || [])[0];
            if (!res || typeof res.lat !== "number" || typeof res.lon !== "number") return null;
            return { point: { lat: res.lat, lon: res.lon }, name: res.display || addr };
          });
      }
      if (dirFrom.value === "center") {
        var c = map.getCenter();
        return Promise.resolve({ point: { lat: c.lat, lon: c.lng }, name: "Map centre" });
      }
      var from = findPin(dirFrom.value);
      return Promise.resolve(from ? { point: from, name: pinLabel(from) } : null);
    }
    function resolveTo() {
      var addr = (dirToAddr.value || "").trim();
      if (addr) {
        return fetch("/api/geocode?q=" + encodeURIComponent(addr), { signal: AbortSignal.timeout(8000) })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var res = (data.results || [])[0];
            if (!res || typeof res.lat !== "number" || typeof res.lon !== "number") return null;
            return { point: { lat: res.lat, lon: res.lon }, name: res.display || addr };
          });
      }
      var to = findPin(dirTo.value);
      return Promise.resolve(to ? { point: to, name: pinLabel(to) } : null);
    }
    Promise.all([resolveFrom(), resolveTo()]).then(function (pair) {
      if (request !== directionsRequest) return;
      var from = pair[0], to = pair[1];
      if (!from) { dirStatus.textContent = "Could not find that starting address."; return; }
      if (!to) { dirStatus.textContent = "Pick a saved place to go to, or type a destination address."; return; }
      showRoute(from.point, to.point, from.name, to.name, request);
    }).catch(function () {
      if (request === directionsRequest) dirStatus.textContent = "Address lookup failed — is the hub still running?";
    });
  });
  document.getElementById("dir-clear").addEventListener("click", function () {
    directionsRequest++;
    clearDirectionsLine();
    dirStatus.textContent = "";
  });

  // -- drawings: grid-down planning marks ---------------------------
  // Drawn items live in the hub (drawings.db, /api/drawings) — the
  // hub is the source of truth, like pins, so they survive a browser
  // clear and a laptop restart. Localhost-only: a shared (hotspot)
  // client gets no drawings panel and no Draw button, and the server
  // 403s /api/drawings for them.
  var DRAW_TYPES = {
    "water": { label: "Water", color: "#4AA3FF" },
    "food": { label: "Food", color: "#55D5A1" },
    "fuel": { label: "Fuel", color: "#FF7043" },
    "medical": { label: "Medical", color: "#E53935" },
    "shelter": { label: "Shelter", color: "#B388EB" },
    "hazard": { label: "Hazard", color: "#EC407A" },
    "rally": { label: "Rally point", color: "#AAB8ED" },
    "other": { label: "Other", color: "#9BA9C0" }

  var drawings = [];
  var hiddenDrawTypes = new Set();
  var drawMode = false;
  var drawTool = null;      // marker | line | polygon | circle
  var drawPoints = [];      // [[lat, lon], ...] while drawing
  var pendingDraw = null;   // {kind, geometry} awaiting label + type
  var editingDrawId = null; // id being edited, or null
  var drawingsBox = document.getElementById("drawings");
  var drawList = document.getElementById("draw-list");
  var drawEmpty = document.getElementById("draw-empty");
  var drawForm = document.getElementById("draw-form");
  var drawLabel = document.getElementById("draw-label");
  var drawType = document.getElementById("draw-type");
  var drawTools = document.getElementById("draw-tools");
  var drawModeBtn = document.getElementById("draw-mode");
  var drawFilters = document.getElementById("draw-type-filters");

  // Type select options + filter chips, built from DRAW_TYPES so the
  // list of types lives in exactly one place.
  Object.keys(DRAW_TYPES).forEach(function (type) {
    var opt = document.createElement("option");
    opt.value = type;
    opt.textContent = DRAW_TYPES[type].label;
    drawType.appendChild(opt);
    var chip = document.createElement("button");
    chip.type = "button";
    chip.className = "draw-type-chip";
    chip.setAttribute("aria-pressed", "true");
    var dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = DRAW_TYPES[type].color;
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(DRAW_TYPES[type].label));
    chip.addEventListener("click", function () {
      if (hiddenDrawTypes.has(type)) hiddenDrawTypes.delete(type);
      else hiddenDrawTypes.add(type);
      chip.classList.toggle("off", hiddenDrawTypes.has(type));
      chip.setAttribute("aria-pressed", String(!hiddenDrawTypes.has(type)));
      applyDrawFilters();
    });
    drawFilters.appendChild(chip);
  });

  function drawFilter() {
    // Show everything whose type is NOT hidden. The in-progress
    // preview uses type "preview", which is never a real type, so
    // it is never filtered out.
    return ["!", ["in", ["get", "type"], ["literal", Array.from(hiddenDrawTypes)]]];
  }
  function applyDrawFilters() {
    if (!map.isStyleLoaded()) return;
    ["drawings-fill", "drawings-line", "drawings-points", "drawings-labels"].forEach(function (id) {
      if (map.getLayer(id)) map.setFilter(id, drawFilter());
    });
  }
  // A circle is stored as centre + radius; the map needs a ring.
  // 64 points is smooth at any zoom and cheap to rebuild.
  function circleRing(lat, lon, radiusM, steps) {
    var ring = [];
    var R = 6371000;
    var d = radiusM / R;
    var latRad = lat * Math.PI / 180;
    var lonRad = lon * Math.PI / 180;
    for (var i = 0; i <= steps; i++) {
      var brng = (i / steps) * 2 * Math.PI;
      var pLat = Math.asin(Math.sin(latRad) * Math.cos(d) + Math.cos(latRad) * Math.sin(d) * Math.cos(brng));
      var pLon = lonRad + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(latRad), Math.cos(d) - Math.sin(latRad) * Math.sin(pLat));
      ring.push([pLon * 180 / Math.PI, pLat * 180 / Math.PI]);
    }
    return ring;
  }
  function drawingsFeature(d) {
    var props = { id: d.id, kind: d.kind, type: d.type, label: d.label || "",
                  color: (DRAW_TYPES[d.type] || DRAW_TYPES.other).color };
    var g = d.geometry;
    if (d.kind === "marker") {
      return { type: "Feature", properties: props,
               geometry: { type: "Point", coordinates: [g.lon, g.lat] } };
    }
    if (d.kind === "circle") {
      return { type: "Feature", properties: props,
               geometry: { type: "Polygon",
                           coordinates: [circleRing(g.lat, g.lon, g.radius_m, 64)] } };
    }
    if (d.kind === "polygon") {
      return { type: "Feature", properties: props,
               geometry: { type: "Polygon", coordinates: [closeRing(g.points)] } };
    }
    return { type: "Feature", properties: props,
             geometry: { type: "LineString", coordinates: toLngLat(g.points) } };
  }
  // The shape being drawn, rendered while it is still unfinished.
  // A polygon with fewer than 3 points and a line with one point
  // cannot be a Polygon/LineString yet, so they preview as simpler
  // geometry instead of invalid GeoJSON.
  function previewFeature() {
    if (!pendingDraw) return null;
    var g = pendingDraw.geometry;
    var base = { type: "Feature",
                 properties: { id: "preview", kind: pendingDraw.kind,
                               type: "preview", label: "", color: "#EDF0F7" },
                 geometry: null };
    if (pendingDraw.kind === "marker") {
      base.geometry = { type: "Point", coordinates: [g.lon, g.lat] };
    } else if (pendingDraw.kind === "circle") {
      if (g.radius_m && g.radius_m > 1) {
        base.geometry = { type: "Polygon",
                          coordinates: [circleRing(g.lat, g.lon, g.radius_m, 64)] };
      } else {
        base.geometry = { type: "Point", coordinates: [g.lon, g.lat] };
      }
    } else if (pendingDraw.kind === "polygon" && g.points.length >= 3) {
      base.geometry = { type: "Polygon", coordinates: [closeRing(g.points)] };
    } else if (g.points.length >= 2) {
      base.geometry = { type: "LineString", coordinates: toLngLat(g.points) };
    } else if (g.points.length === 1) {
      base.geometry = { type: "Point", coordinates: [g.points[0][1], g.points[0][0]] };

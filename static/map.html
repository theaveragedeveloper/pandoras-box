<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pandora's Box Mk1 — offline map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="128x128" href="/static/brand/pandora.png?v=2">
<link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
<style>
  @font-face {
    font-family: 'Inter'; src: url('/static/brand/inter.woff2') format('woff2');
    font-style: normal; font-weight: 100 900; font-display: swap;
  }
  :root {
    --dur-fast: 100ms;
    --dur-normal: 150ms;
    --dur-slow: 250ms;
    --dur-enter: 200ms;
    --ease-standard: cubic-bezier(0.2,0,0,1);
    --ease-enter: cubic-bezier(0,0,0.2,1);
    --ease-emph-enter: cubic-bezier(0.05,0.7,0.1,1);
    --accent: #AAB8ED;
    --bg: #10141D;
    --canvas: #111726;
    --panel: #171E2B;
    --panel2: #1E2736;
    --line: #2C384A;
    --text: #EDF0F7;
    --muted: #C1CADC;
    --faint: #9BA9C0;
    --danger: #E53935;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  /* MapLibre controls restyled to the app's tokens: dark surface, 1px
     border, sharp corners — the default light-grey rounded controls are
     the single biggest "bolted on" tell inside a dark UI. */
  .maplibregl-ctrl-group {
    background: rgba(23,30,43,.92) !important;
    border: 1px solid #2C384A;
    border-radius: 6px !important;
    box-shadow: none !important;
    overflow: hidden;
  }
  .maplibregl-ctrl-group button {
    background: transparent !important;
    border: none !important;
    border-bottom: 1px solid rgba(255,255,255,.08) !important;
    width: 30px !important; height: 30px !important;
    transition: background var(--dur-normal) var(--ease-standard);
  }
  .maplibregl-ctrl-group button:last-child { border-bottom: none !important; }
  .maplibregl-ctrl-group button:hover { background: rgba(170,184,237,.10) !important; }
  .maplibregl-ctrl-group button:active { background: rgba(170,184,237,.18) !important; }
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(0.85); }
  .maplibregl-ctrl-attrib { background: rgba(23,30,43,.85) !important; color: #C1CADC !important; font: 11px ui-monospace, Menlo, Consolas, monospace !important; }
  .maplibregl-ctrl-attrib a { color: var(--accent) !important; }
  #map-hud {
    position: absolute; top: 10px; left: 10px; right: 52px; z-index: 2;
    pointer-events: none;
  }
  #toolbar {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: fit-content; max-width: 100%;
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  #toolbar a, #toolbar button, #goto, #status, #basemap-status { pointer-events: auto; }
  #toolbar a, #toolbar button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    font: 600 13px/1 Inter, system-ui, sans-serif;
    padding: 8px 11px; cursor: pointer; text-decoration: none;
    transition: background var(--dur-normal) var(--ease-standard), border-color var(--dur-normal) var(--ease-standard), color var(--dur-normal) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
  }
  #toolbar a:hover, #toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  #toolbar.map-unavailable > :not(#map-home) { display: none; }
  #toolbar a:active, #toolbar button:active { transform: scale(0.97); }
  /* ATAK-LAYERS (2026-11-22): area picker for the ATAK style — same
     look as the toolbar buttons; hidden while only one ATAK layer
     exists. */
  #trex-layer {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    font: 600 13px/1 Inter, system-ui, sans-serif;
    padding: 8px 6px; cursor: pointer; pointer-events: auto;
  }
  #toolbar button.active { background: var(--accent); color: #111726; border-color: var(--accent); }
  .tb-label {
    color: #C1CADC; font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 1px; text-transform: uppercase; padding: 0 2px 0 6px;
  }
  #map-search { display: flex; gap: 6px; max-width: 100%; }
  #goto {
    background: var(--canvas); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    font: 13px/1 ui-monospace, Menlo, Consolas, monospace;
    padding: 8px 10px; width: 230px; min-width: 0; outline: none;
    transition: border-color var(--dur-normal) var(--ease-standard), box-shadow var(--dur-normal) var(--ease-standard);
  }
  #goto::placeholder { color: #C1CADC; }
  #goto:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(170,184,237,.18); }
  #status, #basemap-status {
    width: fit-content; max-width: min(420px, 100%); margin-top: 8px;
    background: var(--panel); color: var(--accent);
    border: 1px solid var(--line); border-radius: 8px;
    font: 13px/1.4 system-ui, sans-serif; padding: 8px 10px;
    overflow-wrap: anywhere;
    animation: fadeUp var(--dur-enter) var(--ease-enter) both;
  }
  #status { display: none; }
  #status a { color: var(--accent); }
  /* -- pins ----------------------------------------------------------- */
  #pins {
    position: absolute; left: 10px; bottom: 12px; z-index: 2;
    background: rgba(13, 17, 23, 0.94); color: #EDF0F7;
    border: 1px solid #2C384A; border-radius: 12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    width: 300px; max-width: calc(100% - 20px);
    display: none;
    animation: fadeUp var(--dur-enter) var(--ease-enter) both;
  }
  #pins h3 {
    margin: 0; padding: 9px 12px; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent);
    border-bottom: 1px solid rgba(255,255,255,.12);
    display: flex; justify-content: space-between; align-items: center;
  }
  #pins h3 button {
    background: none; border: none; color: #C1CADC; cursor: pointer;
    font: 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1px;
  }
  #pins h3 button:hover { color: var(--accent); }
  #pinlist { max-height: 180px; overflow-y: auto; }
  .pinrow {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; font-size: 12px; cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,.06);
    transition: background var(--dur-normal) var(--ease-standard);
  }
  .pinrow:hover { background: rgba(255,255,255,.05); }
  .pinrow .coords { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pinrow button.coords { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .pinrow .del { color: #C1CADC; background: none; border: none; cursor: pointer; font-size: 14px; padding: 0 2px; }
  .pinrow .del:hover { color: #E53935; }
  .mkpin {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid #111726;
    box-shadow: 0 0 0 2px var(--accent); cursor: pointer;
  }
  /* -- directions: straight-line distance + bearing to a saved house -- */
  #directions {
    border-top: 1px solid rgba(255,255,255,.12);
    padding: 9px 12px 12px;
  }
  #directions h3 {
    margin: 0 0 8px; padding: 0; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent);
    border-bottom: none; display: block;
  }
  #directions label {
    display: block; font-size: 11px; color: #C1CADC; margin: 0 0 6px;
  }
  #directions select, #directions input[type="text"] {
    width: 100%; box-sizing: border-box; margin-top: 3px;
    background: #171E2B; color: #EDF0F7; border: 1px solid #2C384A;
    border-radius: 6px; padding: 6px 8px;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
  }
  #directions select:focus, #directions input[type="text"]:focus {
    border-color: var(--accent); outline: none;
  }
  #directions .dir-actions { display: flex; gap: 8px; margin: 2px 0 6px; }
  #directions .dir-actions button {
    background: #171E2B; color: #EDF0F7; border: 1px solid #2C384A;
    border-radius: 6px; padding: 6px 10px; cursor: pointer;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
  }
  #directions .dir-actions button:hover { border-color: var(--accent); }
  #directions .dir-actions button:disabled { opacity: .45; cursor: default; }
  #dir-status { margin: 0; font-size: 12px; line-height: 1.5; color: #EDF0F7; }
  #dir-status:empty { display: none; }
  #dir-turns { margin: 8px 0 0; padding-left: 20px; font-size: 12px; line-height: 1.6; color: #EDF0F7; }
  #dir-turns:empty { display: none; }
  #dir-turns .dist { color: #C1CADC; }
  /* reduced motion: kill-switch, mandatory */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important; scroll-behavior: auto !important;
    }
  }
  /* -- print: map + directions on paper ------------------------------ */
  /* The map is a WebGL canvas: without preserveDrawingBuffer (set on
     the Map constructor below) the printed map comes out blank, so
     the print rules below only work together with that option.
     Screen look is untouched; print is dark text on white. */
  #print-header { display: none; }
  @media print {
    @page { size: landscape; margin: 12mm; }
    html, body { background: #fff !important; color: #000; height: auto; }
    #print-header {
      display: block; margin: 0 0 8px;
      font: 700 16px/1.3 Inter, system-ui, sans-serif; color: #000;
    }
    /* Navigation chrome and interactive controls make no sense on paper. */
    #map-hud, .maplibregl-ctrl-group, .maplibregl-ctrl-attrib,
    #pins h3 button, .pinrow .del, #directions label,
    #directions .dir-actions { display: none !important; }
    #map { position: static !important; height: 58vh; width: 100%; }
    /* Stretch the rendered canvas to fill the print box: the canvas
       keeps its on-screen pixel size through the print, so without
       this the map prints small with white space around it. */
    #map canvas { width: 100% !important; height: 100% !important; }
    /* The pins panel only prints when it has something to show: saved
       pins, or an active route. The form itself never prints. */
    #pins:not(.has-pins):not(.has-directions) { display: none !important; }
    #pins {
      position: static !important; display: block !important;
      width: 100%; max-width: none; margin: 10px 0 0;
      background: #fff !important; color: #000;
      border: 1px solid #999; border-radius: 0;
    }
    #pins h3, #directions h3 { color: #000; }
    #pinlist { max-height: none; overflow: visible; }
    #directions, #dir-status, #dir-turns { color: #000; }
    /* The status line only prints with a route: otherwise it holds the
       on-screen "type both addresses" hint, which is noise on paper. */
    #dir-status { display: none; }
    #pins.has-directions #dir-status { display: block; }
    #pins:not(.has-directions) #directions { display: none; }
    #dir-turns .dist { color: #333; }
  }
</style>
</head>
<body>
<div id="print-header">Pandora&rsquo;s Box Mk1 &mdash; Map and directions</div>
<div id="map"></div>
<div id="map-hud">
  <div id="toolbar">
    <a id="map-home" href="/" target="_blank" rel="noopener">Home</a>
    <button data-style="dark" class="active">Dark</button>
    <button data-style="light">Light</button>
    <button data-style="topo">Topo</button>
    <button data-style="trex">ATAK</button>
    <!-- ATAK-LAYERS (2026-11-22): area picker for the ATAK style.
         Options come from /api/map-config (trex_layers); hidden
         while only the Braintree export exists. -->
    <select id="trex-layer" aria-label="ATAK area" hidden></select>
    <span class="tb-label">Map</span>
    <button data-src="/tiles/conus.pmtiles">US</button>
    <button data-src="/tiles/ne.pmtiles">New England</button>
    <button id="pinmode">Add pin</button>
    <button id="print-map" type="button">Print</button>
    <form id="map-search" role="search" aria-label="Find a place on the map">
      <input id="goto" type="text" aria-label="Place, address, or coordinates" placeholder="Place, address, or lat/lon" autocomplete="off">
      <button id="gobtn" type="submit">Go</button>
    </form>
  </div>
  <div id="basemap-status" role="status" hidden></div>
  <div id="status" role="status"></div>
</div>
<div id="pins">
  <h3>Pins <button id="clearpins">Clear all</button></h3>
  <div id="pinlist"></div>
  <div id="directions">
    <h3>Directions</h3>
    <label>From
      <select id="dir-from" aria-label="Starting point"></select>
    </label>
    <label>Or type a starting address
      <input id="dir-from-addr" type="text" placeholder="e.g. 123 Main St" autocomplete="off">
    </label>
    <label>To a saved place
      <select id="dir-to" aria-label="Destination"></select>
    </label>
    <label>Or type a destination address
      <input id="dir-to-addr" type="text" placeholder="e.g. 55 Fogg Rd, Weymouth" autocomplete="off">
    </label>
    <div class="dir-actions">
      <button id="dir-go" type="button">Show directions</button>
      <button id="dir-clear" type="button">Clear</button>
      <button id="dir-print" type="button">Print directions</button>
    </div>
    <p id="dir-status" role="status"></p>
    <ol id="dir-turns"></ol>
  </div>
</div>
<script src="/static/vendor/pmtiles.js"></script>
<script src="/static/vendor/maplibre-gl.js"></script>
<script src="/static/pins.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var readiness = window.parent !== window && params.get("readiness") === "1";
  if (readiness) document.getElementById("map-hud").hidden = true;
  // Print: both buttons call window.print(); the @media print rules
  // in <style> decide what lands on paper (map + turn list only).
  document.getElementById("print-map").addEventListener("click", function () { window.print(); });
  document.getElementById("dir-print").addEventListener("click", function () { window.print(); });
  function reportReadiness(ok, detail) {
    window.parent.postMessage({ type: "mk1-map-readiness", ok: ok, detail: detail }, location.origin);
  }
  function mapNumber(key, min, max) {
    var raw = params.get(key)?.trim();
    var value = raw ? Number(raw) : NaN;
    return Number.isFinite(value) && value >= min && value <= max ? value : null;
  }
  var requestedLat = mapNumber("lat", -90, 90);
  var lat = requestedLat ?? 39.8283;
  var lon = mapNumber("lon", -180, 180) ?? -98.5795;
  var requestedZoom = mapNumber("zoom", 0, 22);
  var zoom = requestedZoom ?? 10;
  // Which extract to read. Default is the CONUS extract (whole
  // contiguous US); pass ?src=/tiles/ne.pmtiles for the smaller
  // New England extract. The hub serves /tiles/* with HTTP Range
  // support, which pmtiles.js needs.
  var requestedSource = params.get("src") || "";
  var src = /^\/tiles\/[^/\\?#]+\.pmtiles$/.test(requestedSource)
    ? requestedSource : "/tiles/conus.pmtiles";
  var styleButtons = document.querySelectorAll("#toolbar button[data-style]");
  var sourceButtons = document.querySelectorAll("#toolbar button[data-src]");
  var requestedStyle = params.get("style");
  var currentStyle = Array.from(styleButtons).some(function (b) {
    return b.dataset.style === requestedStyle;
  }) ? requestedStyle : "dark";
  var currentVectorKey = currentStyle === "light" ? "light" : "dark";

  var status = document.getElementById("status");
  var basemapStatus = document.getElementById("basemap-status");
  var availabilityRequest;
  // Escape messages that include map errors or text from place search.
  // Null/undefined escape to '' (same as ui.html), not "null".
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // showStatus is an HTML sink: it sets innerHTML exactly as given.
  // Callers must pass already-escaped strings (esc() any user text
  // first) or static markup — never raw user input.
  function showStatus(html) {
    status.innerHTML = html;
    status.style.display = "block";
  }
  function hideStatus() { status.style.display = "none"; }

  function showBasemapStatus(message) {
    basemapStatus.textContent = message;
    basemapStatus.hidden = !message;
  }

  function checkBasemap() {
    if (availabilityRequest) availabilityRequest.abort();
    var request = new AbortController();
    availabilityRequest = request;
    var style = currentStyle;
    var key = style === "topo" || style === "trex" ? style : "vector";
    var label = key === "topo" ? "Topo" : key === "trex" ? "ATAK" :
      src === "/tiles/conus.pmtiles" ? "US" :
      src === "/tiles/ne.pmtiles" ? "New England" : src;
    showBasemapStatus("");
    fetch("/api/maps/availability?" + new URLSearchParams({ src: src }), {
      cache: "no-store",
      signal: request.signal
    }).then(function (response) {
      if (!response.ok) throw new Error("Map availability request failed");
      return response.json();
    }).then(function (assets) {
      if (request.signal.aborted || assets[key]) return;
      showBasemapStatus(label + " map data is missing. Try another style or map source.");
    }).catch(function () {
      if (!request.signal.aborted && basemapStatus.hidden) {
        showBasemapStatus("Could not check offline map files. Try reloading the map.");
      }
    });
  }

  var protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  // Vector styles (dark / light) over the Protomaps extract. The topo
  // style is a raster layer of real USGS topo tiles, downloaded into
  // maps_dir/topo/ — not a recolour of the vector data.
  function baseStyle(name) {
    return {
      "version": 8,
      "name": name,
      "glyphs": "/static/vendor/glyphs/{fontstack}/{range}.pbf",
      "sources": {
        "protomaps": {
          "type": "vector",
          "url": "pmtiles://" + src,
          "attribution": "OpenStreetMap contributors"
        }
      },
      "layers": []
    };
  }

  function layersFor(p) {
    return [
      { "id": "background", "type": "background",
        "paint": { "background-color": p.bg } },
      { "id": "landuse-park", "type": "fill", "source": "protomaps",
        "source-layer": "landuse",
        "filter": ["match", ["get", "kind"], ["park", "national_park", "forest"], true, false],
        "paint": { "fill-color": p.park, "fill-opacity": 0.9 } },
      { "id": "water", "type": "fill", "source": "protomaps",
        "source-layer": "water",
        "paint": { "fill-color": p.water } },
      { "id": "waterway", "type": "line", "source": "protomaps",
        "source-layer": "waterway",
        "paint": { "line-color": p.water, "line-width": 1 } },
      { "id": "roads-minor", "type": "line", "source": "protomaps",
        "source-layer": "roads", "minzoom": 10,
        "paint": { "line-color": p.roadMinor, "line-width": 1 } },
      { "id": "roads-major", "type": "line", "source": "protomaps",
        "source-layer": "roads", "minzoom": 7,
        "filter": ["match", ["get", "kind"], ["highway", "major_road"], true, false],
        "paint": { "line-color": p.roadMajor, "line-width": 2 } },
      { "id": "buildings", "type": "fill", "source": "protomaps",
        "source-layer": "buildings", "minzoom": 13,
        "paint": { "fill-color": p.building, "fill-opacity": 0.9 } },
      { "id": "boundaries", "type": "line", "source": "protomaps",
        "source-layer": "boundaries",
        "paint": { "line-color": p.boundary, "line-width": 1,
                   "line-dasharray": [4, 2] } },
      { "id": "places", "type": "symbol", "source": "protomaps",
        "source-layer": "places", "minzoom": 8,
        "filter": ["match", ["get", "kind"], ["locality", "region", "country"], true, false],
        "layout": { "text-field": ["get", "name"],
                    "text-font": ["Noto Sans Regular"],
                    "text-size": 13, "text-anchor": "center" },
        "paint": { "text-color": p.label,
                   "text-halo-color": p.halo, "text-halo-width": 1 } }
    ];
  }

  var PALETTES = {
    dark: {
      bg: "#050709", park: "#0d1a16", water: "#0e1e28",
      roadMinor: "#21262D", roadMajor: "#8a919c",
      building: "#161B22", boundary: "#2d333b",
      label: "#F7F9FC", halo: "#050709"
    },
    light: {
      bg: "#e8e4dc", park: "#c2d9b0", water: "#a8c8e0",
      roadMinor: "#ffffff", roadMajor: "#00647f",
      building: "#c8c0b8", boundary: "#a8a090",
      label: "#222222", halo: "#ffffff"
    }
  };

  function makeVectorStyle(key) {
    var s = baseStyle("Pandora's Box Mk1 — " + key);
    s.layers = layersFor(PALETTES[key] || PALETTES.dark);
    return s;
  }

  function makeTopoStyle() {
    return {
      "version": 8,
      "name": "Pandora's Box Mk1 — USGS topo",
      "sources": {
        "topo": {
          "type": "raster",
          "tiles": ["/tiles/topo/{z}/{x}/{y}.jpg"],
          "tileSize": 256,
          "maxzoom": 12,
          "attribution": "USGS"
        }
      },
      "layers": [
        { "id": "background", "type": "background",
          "paint": { "background-color": "#e8e4dc" } },
        { "id": "topo", "type": "raster", "source": "topo" }
      ]
    };
  }

  // ATAK layers: the T.REX Braintree export (25 MB MBTiles, z12-z15,
  // JPEG) plus USGS topo MBTiles for Massachusetts (z12-z15) and New
  // England (z10-z12). Each layer covers its own area, so switching
  // to ATAK also flies to the selected layer's centre — anywhere
  // else would be blank. Centres, bounds and the layer list come
  // from the hub (/api/map-config, localhost-only); a shared client,
  // or a failed fetch, falls back to a generic CONUS centre, so the
  // served page never embeds the covered area.
  var trexCenter = null; // [lon, lat]
  var trexBounds = null; // [west, south, east, north]
  // ATAK-LAYERS (2026-11-22): layers from /api/map-config
  // (trex_layers); trexLayer is the selected one, or null when no
  // layer list arrived (shared client) — then the legacy
  // first-layer tile URL stands.
  var trexLayers = [];
  var trexLayer = null;
  fetch("/api/map-config", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("map-config unavailable");
      return r.json();
    })

      var to = findPin(dirTo.value);
      return Promise.resolve(to ? { point: to, name: pinLabel(to) } : null);
    }
    Promise.all([resolveFrom(), resolveTo()]).then(function (pair) {
      var from = pair[0], to = pair[1];
      if (!from) { dirStatus.textContent = "Could not find that starting address."; return; }
      if (!to) { dirStatus.textContent = "Pick a saved place to go to, or type a destination address."; return; }
      showRoute(from.point, to.point, from.name, to.name);
    }).catch(function () { dirStatus.textContent = "Address lookup failed — is the hub still running?"; });
  });
  document.getElementById("dir-clear").addEventListener("click", function () {
    clearDirectionsLine();
    dirStatus.textContent = "";
  });

  pinBtn.addEventListener("click", function () {
    pinMode = !pinMode;
    pinBtn.classList.toggle("active", pinMode);
    map.getCanvas().style.cursor = pinMode ? "crosshair" : "";
    if (pinMode) showStatus("Pin mode on — click the map to drop a pin. Click Add pin again to stop.");
    else hideStatus();
  });

  map.on("click", function (e) {
    if (!pinMode) return;
    addPin(e.lngLat.lat, e.lngLat.lng, "");
    hideStatus();
  });

  // -- go to: coordinates, street address, or a place name ----------
  var gotoInput = document.getElementById("goto");
  function searchPlace(t) {
    // Place name: ask the hub's place search (offline gazetteer).
    fetch("/api/search?q=" + encodeURIComponent(t))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var hit = null;
        (data.groups || []).forEach(function (g) {
          if (hit) return;
          (g.results || []).forEach(function (r) {
            if (!hit && typeof r.lat === "number" && typeof r.lon === "number") hit = r;
          });
        });
        if (!hit) { showStatus("No place found for &quot;" + esc(t) + "&quot;."); return; }
        map.flyTo({ center: [hit.lon, hit.lat], zoom: 13, duration: 400, essential: true });
        addPin(hit.lat, hit.lon, hit.title);
        hideStatus();
      })
      .catch(function () { showStatus("Place search failed — is the hub still running?"); });
  }
  function goTo(text) {
    var t = (text || "").trim();
    if (!t) return;
    // Coordinates: "42.36, -71.06" or "42.36 -71.06". Lat first;
    // if the first number is out of lat range, assume lon, lat.
    var m = t.match(/^(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)$/);
    if (m) {
      var a = parseFloat(m[1]), b = parseFloat(m[2]);
      var la, lo;
      if (Math.abs(a) <= 90 && Math.abs(b) <= 180) { la = a; lo = b; }
      else if (Math.abs(a) <= 180 && Math.abs(b) <= 90) { la = b; lo = a; }
      else { showStatus("Coordinates out of range."); return; }
      map.flyTo({ center: [lo, la], zoom: 13, duration: 400, essential: true });
      addPin(la, lo, "");
      hideStatus();
      return;
    }
    // Street address: "123 Main St" — the hub's offline
    // address index (OpenStreetMap). Only when the input starts with
    // a house number; anything else is a place name. No match (or no
    // index yet) falls through to the place search.
    if (/^\d+[A-Za-z]?\s+\S/.test(t)) {
      fetch("/api/geocode?q=" + encodeURIComponent(t))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var res = (data.results || [])[0];
          if (!res || typeof res.lat !== "number" || typeof res.lon !== "number") { searchPlace(t); return; }
          map.flyTo({ center: [res.lon, res.lat], zoom: 16, duration: 400, essential: true });
          // An address lookup drops a pin whose address is the
          // geocoded display address (no label yet — name it from
          // the Saved Locations "Save a house" form on the hub).
          addPin(res.lat, res.lon, "", res.display || "");
          hideStatus();
        })
        .catch(function () { searchPlace(t); });
      return;
    }
    searchPlace(t);
  }
  document.getElementById("map-search").addEventListener("submit", function (e) {
    e.preventDefault();
    goTo(gotoInput.value);
  });

  map.on("error", function (e) {
    var msg = (e && e.error && e.error.message) || "unknown map error";
    if (/\/static\/vendor\/glyphs\//i.test(msg)) return;
    if (basemapStatus.hidden) {
      showBasemapStatus("Map data could not load. Try another style or map source.");
    }
  });

  // Pins are laptop-only: a shared (hotspot) client gets no pin
  // sync and no pins panel (and no Add-pin button). The server 403s
  // /api/pins for them; skipping sync here is the second layer.
  var localMapPage = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
  if (localMapPage) {
    // Load pins from the hub first (server is the source of truth);
    // sync() falls back to this browser's cache when the hub is
    // unreachable, and migrates local pins to the server on first run.
    mk1Pins.sync().then(loadPins).catch(loadPins);
  } else {
    pinsBox.style.display = "none";
    pinBtn.style.display = "none";
  }
  window.addEventListener("storage", event => {
    if (!localMapPage) return;
    if (!event.key || event.key === mk1Pins.key) loadPins();
  });
})();
</script>
</body>
</html>
